<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KZYS Architecture Diagram</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'JetBrains Mono', monospace; background: #020617; color: white; padding: 2rem; }
    .container { max-width: 1000px; margin: 0 auto; }
    .diagram-container { background: rgba(15, 23, 42, 0.5); border-radius: 1rem; border: 1px solid #1e293b; padding: 1.5rem; }
    svg { width: 100%; height: auto; }
  </style>
</head>
<body>
  <div class="container">
    <h1>KZYS Architecture</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 800 400">
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
          </marker>
        </defs>

        <!-- Components -->
        <!-- User -->
        <rect x="50" y="150" width="100" height="60" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="2"/>
        <text x="100" y="185" fill="white" font-size="12" text-anchor="middle">User</text>

        <!-- React Frontend -->
        <rect x="250" y="50" width="120" height="60" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="2"/>
        <text x="310" y="85" fill="white" font-size="12" text-anchor="middle">React SPA</text>

        <!-- Go Signaling -->
        <rect x="250" y="250" width="120" height="60" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="2"/>
        <text x="310" y="285" fill="white" font-size="12" text-anchor="middle">Go Signaling</text>

        <!-- LiveKit SFU -->
        <rect x="500" y="150" width="120" height="60" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="2"/>
        <text x="560" y="185" fill="white" font-size="12" text-anchor="middle">LiveKit SFU</text>

        <!-- Arrows -->
        <line x1="150" y1="180" x2="250" y2="100" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)"/>
        <line x1="150" y1="180" x2="250" y2="280" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)"/>
        <line x1="370" y1="280" x2="500" y2="200" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)"/>
        <line x1="370" y1="80" x2="500" y2="170" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)"/>
      </svg>
    </div>
  </div>
</body>
</html>
