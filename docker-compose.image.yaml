name: project-k

# Hub-only overlay — skip local builds and always pull published images.
#
# Usage:
#   docker compose -f docker-compose.yaml -f docker-compose.image.yaml pull
#   docker compose -f docker-compose.yaml -f docker-compose.image.yaml up -d
#
# Images (set in .env):
#   WEB_IMAGE=kyawzayarsoe/project-k-web:latest
#   SERVER_IMAGE=kyawzayarsoe/project-k-csharp:latest

services:
  server:
    pull_policy: always
    image: ${SERVER_IMAGE:-kyawzayarsoe/project-k-csharp:latest}
    build: !reset null

  web:
    pull_policy: always
    image: ${WEB_IMAGE:-kyawzayarsoe/project-k-web:latest}
    build: !reset null

  web-dev:
    profiles: ["dev"]
    pull_policy: always
    image: ${WEB_DEV_IMAGE:-kyawzayarsoe/project-k-web:dev}
    build: !reset null
