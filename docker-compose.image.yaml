name: project-k

# Hub-only overlay — skip local builds and always pull published images.
#
# Usage:
#   docker compose -f docker-compose.yaml -f docker-compose.image.yaml pull
#   docker compose -f docker-compose.yaml -f docker-compose.image.yaml up -d
#
# Requires images already pushed (e.g. kyawzayarsoe/project-k-web:latest).

services:
  server:
    pull_policy: always
    image: ${DOCKERHUB_USER:-kyawzayarsoe}/project-k-csharp:${IMAGE_TAG:-latest}

  web:
    pull_policy: always
    image: ${DOCKERHUB_USER:-kyawzayarsoe}/project-k-web:${IMAGE_TAG:-latest}

  web-dev:
    pull_policy: always
    image: ${DOCKERHUB_USER:-kyawzayarsoe}/project-k-web:dev
