# kind local (2 workers) — MeetingMax
# Edit PUBLIC_HOST / TURN_HOST / LIVEKIT_NODE_IP / LIVEKIT_PUBLIC_URL to your Wi‑Fi LAN IP
# (phone must use the same LAN IP, not localhost).
#
# Apply:
#   cd k8s/local
#   kubectl apply -f .
apiVersion: v1
kind: ConfigMap
metadata:
  name: kzys-app-config
  labels:
    app.kubernetes.io/part-of: project-k
    app.kubernetes.io/env: kind-local
data:
  SERVICE_NAME: "kzys-control-plane"
  CORS_ORIGIN: "*"
  MAX_ROOM_PARTICIPANTS: "10000"
  LARGE_ROOM_EVENT_THRESHOLD: "500"
  PARTICIPANTS_PAGE_SIZE: "50"
  PARTICIPANTS_SEARCH_SCAN_CAP: "10000"
  WEBINAR_ENTER_LISTENERS: "10000"
  WEBINAR_ENTER_RATIO: "8.0"
  WEBINAR_EXIT_LISTENERS: "50"
  INTERACTIVE_MAX_PUBLISHERS: "10000"
  WEBINAR_MAX_PUBLISHERS: "50"
  SFU_PUBLISHERS_PER_NODE: "50"
  KZYS_SFU_STANDBY_POOL: "0"
  # Your laptop Wi‑Fi IP (phone opens https://THIS_IP/)
  PUBLIC_HOST: "192.168.1.6"
  TURN_HOST: "192.168.1.6"
  # ICE address LiveKit advertises to browsers (must be phone-reachable)
  LIVEKIT_NODE_IP: "192.168.1.6"
  TURN_PORT: "3478"
  TURN_TLS_PORT: "5349"
  TURN_USE_TLS: "false"
  TURN_REALM: "kzys.local"
  # Same-origin LiveKit via nginx HTTPS proxy on the web LB
  LIVEKIT_PUBLIC_URL: "wss://192.168.1.6/livekit"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kzys-livekit-config
  labels:
    app.kubernetes.io/part-of: project-k
    app.kubernetes.io/env: kind-local
data:
  livekit.yaml: |
    port: 7880
    bind_addresses:
      - ""
    rtc:
      tcp_port: 7881
      port_range_start: 50000
      port_range_end: 50100
      use_external_ip: false
      enable_loopback_candidate: false
    redis:
      address: redis:6379
    room:
      empty_timeout: 300
      departure_timeout: 20
    node_selector:
      kind: sysload
      sysload_limit: 0.85
    logging:
      level: info
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coturn-config
  labels:
    app.kubernetes.io/part-of: project-k
    app.kubernetes.io/env: kind-local
data:
  turnserver.conf: |
    listening-port=3478
    tls-listening-port=5349
    use-auth-secret
    min-port=20000
    max-port=20100
    no-tls
    no-dtls
    fingerprint
    lt-cred-mech
    no-multicast-peers
    no-cli
    log-file=stdout
    verbose
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kzys-web-nginx
  labels:
    app.kubernetes.io/part-of: project-k
    app.kubernetes.io/env: kind-local
data:
  default.conf: |
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        ssl_certificate     /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location /api/ {
            proxy_pass http://kzys-control-plane:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /ws/ {
            proxy_pass http://kzys-control-plane:4000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400;
        }

        location /health {
            proxy_pass http://kzys-control-plane:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /ready {
            proxy_pass http://kzys-control-plane:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /livekit/ {
            proxy_pass http://kzys-livekit:7880/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
