# Topic: TURN env for API tickets + Coturn --external-ip. Stamped by apply-local.ps1.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kzys-config-coturn
  labels:
    app.kubernetes.io/part-of: project-k
    app.kubernetes.io/env: kind-local
    app.kubernetes.io/component: coturn
data:
  TURN_HOST: "192.168.1.3"
  TURN_PORT: "3478"
  TURN_TLS_PORT: "5349"
  TURN_USE_TLS: "false"
  TURN_REALM: "kzys.local"
---
# Topic: Coturn server config file (mounted at /etc/coturn).
apiVersion: v1
kind: ConfigMap
metadata:
  name: coturn-config
  labels:
    app.kubernetes.io/part-of: project-k
    app.kubernetes.io/env: kind-local
    app.kubernetes.io/component: coturn
data:
  turnserver.conf: |
    listening-port=3478
    tls-listening-port=5349
    use-auth-secret
    min-port=20000
    max-port=20000
    no-tls
    no-dtls
    fingerprint
    lt-cred-mech
    no-multicast-peers
    no-cli
    log-file=stdout
    verbose
