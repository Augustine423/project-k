# Kind create-config (not a Kubernetes object — do not kubectl apply this file).
#
# Default: 1 control-plane. That is enough for laptop tests.
# Add more `- role: worker` blocks if you want extra nodes; media/TURN stay on
# the control-plane so hostPort mappings below still reach the laptop.
#
#   kind create cluster --name local --config cluster/kind.yaml
#
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      - containerPort: 3478
        hostPort: 3478
        protocol: TCP
      - containerPort: 3478
        hostPort: 3478
        protocol: UDP
      - containerPort: 20000
        hostPort: 20000
        protocol: UDP
      - containerPort: 7881
        hostPort: 7881
        protocol: TCP
      - containerPort: 7882
        hostPort: 7882
        protocol: UDP
  # Optional extra nodes (uncomment as many as you want):
  # - role: worker
  # - role: worker
