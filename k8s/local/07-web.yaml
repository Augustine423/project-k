# Frontend nginx — cloud-provider LoadBalancer :80/:443
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kzys-web
  labels:
    app: kzys-web
    app.kubernetes.io/part-of: project-k
    app.kubernetes.io/env: kind-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kzys-web
  template:
    metadata:
      labels:
        app: kzys-web
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: web
          image: kyawzayarsoe/project-k-web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443
          env:
            - name: PUBLIC_HOST
              valueFrom:
                configMapKeyRef:
                  name: kzys-app-config
                  key: PUBLIC_HOST
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: tls
              mountPath: /etc/nginx/tls
          readinessProbe:
            httpGet:
              path: /
              port: 443
              scheme: HTTPS
            periodSeconds: 5
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 443
              scheme: HTTPS
            periodSeconds: 15
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: nginx-config
          configMap:
            name: kzys-web-nginx
        - name: tls
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kzys-web
  labels:
    app: kzys-web
spec:
  type: LoadBalancer
  selector:
    app: kzys-web
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 443
