# MeetingMax — local laptop Kubernetes (Docker Desktop / kind + cloud-provider LB)
#
# Goal: phone on same Wi‑Fi opens https://<LAN_IP>/ and joins a room hosted on this PC.
#
# Prerequisites
#   1) Enable Kubernetes in Docker Desktop (or kind/minikube)
#   2) Install a LoadBalancer provider so Service type=LoadBalancer gets an EXTERNAL-IP
#      (cloud-provider-kind, MetalLB, or Docker Desktop cloud-provider)
#   3) Phone + laptop on the same Wi‑Fi (LAN), not mobile data
#
# Quick deploy
#   powershell -File k8s/local/deploy-local.ps1
#
# Then open on phone: https://192.168.x.x/  (accept self-signed cert warning)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../01-configmap.yaml
  - ../02-secrets.example.yaml
  - ../03-redis.yaml
  - ../04-livekit.yaml
  - ../05-coturn.yaml
  - ../06-control-plane.yaml
  - ../07-web.yaml

patches:
  - path: patch-livekit-local.yaml
  - path: patch-web-lb-local.yaml
  - path: patch-config-local.yaml
  - path: patch-control-plane-local.yaml
  - path: patch-coturn-local.yaml
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: livekit
    path: patch-livekit-remove-affinity.json
