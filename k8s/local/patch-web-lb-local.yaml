# Local LB — drop GKE-only annotations; keep type LoadBalancer for cloud-provider / MetalLB.
apiVersion: v1
kind: Service
metadata:
  name: kzys-web
  annotations:
    cloud.google.com/l4-rbs: null
    networking.gke.io/load-balancer-type: null
spec:
  type: LoadBalancer
  # On some local providers EXTERNAL-IP stays pending; NodePort still works via LAN:30080/30443
  # after deploy-local.ps1 patches. Prefer LoadBalancer when EXTERNAL-IP is assigned.
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
    - name: https
      port: 443
      targetPort: 443
      nodePort: 30443
