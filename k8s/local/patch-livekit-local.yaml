# Single-node laptop: 1 LiveKit pod + lower CPU/RAM.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: livekit
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: livekit
spec:
  minReplicas: 1
  maxReplicas: 1
