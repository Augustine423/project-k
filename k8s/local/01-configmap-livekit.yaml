# Topic: LiveKit ICE + signal URL. LAN IPs stamped by apply-local.ps1.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kzys-config-livekit
  labels:
    app.kubernetes.io/part-of: project-k
    app.kubernetes.io/env: kind-local
    app.kubernetes.io/component: livekit
data:
  LIVEKIT_NODE_IP: "192.168.1.3"
  LIVEKIT_MEDIA_IP: "192.168.1.3"
  LIVEKIT_PUBLIC_URL: "wss://192.168.1.3/livekit"
---
# Topic: LiveKit server config file (mounted at /etc/livekit).
apiVersion: v1
kind: ConfigMap
metadata:
  name: kzys-livekit-config
  labels:
    app.kubernetes.io/part-of: project-k
    app.kubernetes.io/env: kind-local
    app.kubernetes.io/component: livekit
data:
  livekit.yaml: |
    port: 7880
    bind_addresses:
      - "0.0.0.0"
    rtc:
      tcp_port: 7881
      # Single mux UDP port (not 50xxx — Hyper-V excludes that range on Windows).
      udp_port: 7882
      use_external_ip: false
      enable_loopback_candidate: true
      # hostNetwork kind node has many veths sharing 10.244.0.1 — bind only eth0.
      interfaces:
        includes:
          - eth0
    redis:
      address: redis:6379
    room:
      empty_timeout: 300
      departure_timeout: 20
    node_selector:
      kind: sysload
      sysload_limit: 0.85
    logging:
      level: info
