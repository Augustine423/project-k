apiVersion: apps/v1
kind: Deployment
metadata:
  name: kzys-control-plane
  labels:
    app: kzys-control-plane
    app.kubernetes.io/part-of: project-k
    app.kubernetes.io/env: kind-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kzys-control-plane
  template:
    metadata:
      labels:
        app: kzys-control-plane
    spec:
      containers:
        - name: api
          image: kyawzayarsoe/project-k-csharp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: kzys-config-app
            - configMapRef:
                name: kzys-config-coturn
            - configMapRef:
                name: kzys-config-livekit
          env:
            - name: PORT
              value: "4000"
            - name: REDIS_URL
              value: redis://redis:6379
            - name: JWT_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: kzys-secrets
                  key: JWT_SIGNING_SECRET
            - name: TURN_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: kzys-secrets
                  key: TURN_SHARED_SECRET
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kzys-secrets
                  key: LIVEKIT_API_KEY
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: kzys-secrets
                  key: LIVEKIT_API_SECRET
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kzys-control-plane
  labels:
    app: kzys-control-plane
    project-k.io/lb: clusterip
spec:
  type: ClusterIP
  selector:
    app: kzys-control-plane
  ports:
    - name: http
      port: 4000
      targetPort: 4000
