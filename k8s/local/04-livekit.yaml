# Laptop: 1 LiveKit pod on the kind control-plane.
# ClusterIP = WS signal (ALB/nginx /livekit). Media = hostNetwork on the node
# (kind CNI does not honor hostPort). extraPortMappings or publish-media-ports.ps1
# then expose 7881/7882 on the laptop.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  labels:
    app: livekit
    app.kubernetes.io/part-of: project-k
    app.kubernetes.io/env: kind-local
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: livekit
  template:
    metadata:
      labels:
        app: livekit
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: wait-redis
          image: redis:7-alpine
          command:
            - sh
            - -c
            - until redis-cli -h redis ping | grep -q PONG; do echo waiting-for-redis; sleep 2; done
      containers:
        - name: livekit
          image: livekit/livekit-server:v1.9.12
          args:
            - --config
            - /etc/livekit/livekit.yaml
            - --keys
            - "$(LIVEKIT_API_KEY): $(LIVEKIT_API_SECRET)"
            - --node-ip
            - $(LIVEKIT_MEDIA_IP)
          env:
            - name: LIVEKIT_PORT
              value: "7880"
            - name: LIVEKIT_MEDIA_IP
              valueFrom:
                configMapKeyRef:
                  name: kzys-config-livekit
                  key: LIVEKIT_MEDIA_IP
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kzys-secrets
                  key: LIVEKIT_API_KEY
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: kzys-secrets
                  key: LIVEKIT_API_SECRET
          ports:
            - name: signal
              containerPort: 7880
              protocol: TCP
            - name: rtc-tcp
              containerPort: 7881
              protocol: TCP
            - name: rtc-udp
              containerPort: 7882
              protocol: UDP
          volumeMounts:
            - name: config
              mountPath: /etc/livekit
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            tcpSocket:
              port: 7880
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 7880
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: kzys-livekit-config
---
apiVersion: v1
kind: Service
metadata:
  name: kzys-livekit
  labels:
    app: livekit
    project-k.io/lb: clusterip
spec:
  type: ClusterIP
  selector:
    app: livekit
  ports:
    - name: signal
      port: 7880
      targetPort: 7880
