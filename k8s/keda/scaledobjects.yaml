# KEDA autoscalers for the LiveKit + C# backend stack.
# Prereq: KEDA installed in the cluster (helm install keda kedacore/keda).

# ── C# control plane ─────────────────────────────────────────────────────────
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: control-plane-scaler
  namespace: kzys
  labels:
    app.kubernetes.io/part-of: project-k
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kzys-control-plane
  minReplicaCount: 1
  maxReplicaCount: 20
  cooldownPeriod: 120
  triggers:
    - type: redis
      metadata:
        address: redis.kzys.svc.cluster.local:6379
        keyName: kzys:room_count
        activationValue: "1"
        # Scale earlier under multi-room + mega-room fanout.
        targetValue: "10"
---
# ── LiveKit SFU ──────────────────────────────────────────────────────────────
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: livekit-scaler
  namespace: kzys
  labels:
    app.kubernetes.io/part-of: project-k
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: livekit
  minReplicaCount: 1
  maxReplicaCount: 30
  cooldownPeriod: 120
  pollingInterval: 15
  triggers:
    - type: redis
      metadata:
        address: redis.kzys.svc.cluster.local:6379
        keyName: kzys:total_node_load
        activationValue: "3"
        targetValue: "15"
---
# ── Web frontend ─────────────────────────────────────────────────────────────
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: web-scaler
  namespace: kzys
  labels:
    app.kubernetes.io/part-of: project-k
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kzys-web
  minReplicaCount: 1
  maxReplicaCount: 10
  cooldownPeriod: 60
  triggers:
    - type: redis
      metadata:
        address: redis.kzys.svc.cluster.local:6379
        keyName: kzys:room_count
        activationValue: "1"
        targetValue: "30"
