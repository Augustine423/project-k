# Persistent Redis — room state survives pod/node restarts (required for scale-to-zero).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kzys-redis
spec:
  serviceName: kzys-redis
  replicas: 1
  selector:
    matchLabels:
      app: kzys-redis
  template:
    metadata:
      labels:
        app: kzys-redis
        kzys.io/tier: stable
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        args: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
        ports:
        - containerPort: 6379
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "300m"
        volumeMounts:
        - name: redis-data
          mountPath: /data
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 5
          periodSeconds: 10
  volumeClaimTemplates:
  - metadata:
      name: redis-data
    spec:
      accessModes: ["ReadWriteOnce"]
      # Omit storageClassName to use the cluster default StorageClass (standard on minikube/kind/Docker Desktop).
      resources:
        requests:
          storage: 5Gi
