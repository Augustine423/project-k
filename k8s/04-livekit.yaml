# LiveKit SFU cluster — distributed mode via Redis (see kzys-livekit-config).
# hostNetwork: one pod per GKE node (anti-affinity). Scale replicas = media node count.
# Signaling: nginx /livekit → kzys-livekit Service → any node (LiveKit routes to room node).
# Media: UDP 50000-50999 + TCP 7881 on each node's external IP (firewall in configure-public-ips.ps1).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  labels:
    app: livekit
    app.kubernetes.io/part-of: project-k
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: livekit
  template:
    metadata:
      labels:
        app: livekit
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      enableServiceLinks: false
      # Optional: label GKE nodes with project-k.io/media-node=true and uncomment:
      # nodeSelector:
      #   project-k.io/media-node: "true"
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: livekit
              topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 600
      initContainers:
        - name: wait-redis
          image: redis:7-alpine
          command:
            - sh
            - -c
            - until redis-cli -h redis ping | grep -q PONG; do echo waiting-for-redis; sleep 2; done
      containers:
        - name: livekit
          image: livekit/livekit-server:v1.9.12
          args:
            - --config
            - /etc/livekit/livekit.yaml
            - --keys
            - "$(LIVEKIT_API_KEY): $(LIVEKIT_API_SECRET)"
            - --node-ip
            - $(NODE_IP)
          env:
            - name: LIVEKIT_PORT
              value: "7880"
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kzys-secrets
                  key: LIVEKIT_API_KEY
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: kzys-secrets
                  key: LIVEKIT_API_SECRET
          ports:
            - name: signal
              containerPort: 7880
              protocol: TCP
            - name: rtc-tcp
              containerPort: 7881
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/livekit
              readOnly: true
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
            limits:
              cpu: "8"
              memory: 8Gi
          readinessProbe:
            tcpSocket:
              port: 7880
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 7880
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: kzys-livekit-config
---
apiVersion: v1
kind: Service
metadata:
  # Not named "livekit" — that injects LIVEKIT_PORT=tcp://... and breaks the server.
  name: kzys-livekit
  labels:
    app: livekit
spec:
  selector:
    app: livekit
  ports:
    - name: signal
      port: 7880
      targetPort: 7880
    - name: rtc-tcp
      port: 7881
      targetPort: 7881
---
# Scale SFU on CPU — tune min/max to your GKE media node pool size.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: livekit
  labels:
    app: livekit
    app.kubernetes.io/part-of: project-k
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: livekit
  minReplicas: 1
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
