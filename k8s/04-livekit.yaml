apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  namespace: kzys
  labels:
    app: livekit
    app.kubernetes.io/part-of: project-k
spec:
  replicas: 1
  selector:
    matchLabels:
      app: livekit
  template:
    metadata:
      labels:
        app: livekit
    spec:
      # Avoid K8s service-link env (LIVEKIT_PORT=tcp://...) clobbering LiveKit flags.
      enableServiceLinks: false
      initContainers:
        - name: wait-redis
          image: redis:7-alpine
          command:
            - sh
            - -c
            - until redis-cli -h redis ping | grep -q PONG; do echo waiting-for-redis; sleep 2; done
      containers:
        - name: livekit
          image: livekit/livekit-server:v1.9.12
          args:
            - --config
            - /etc/livekit/livekit.yaml
            - --node-ip
            - $(NODE_IP)
          env:
            # Advertise the node IP so ICE works without STUN (use_external_ip: false).
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: LIVEKIT_PORT
              value: "7880"
          ports:
            - name: signal
              containerPort: 7880
            - name: rtc-tcp
              containerPort: 7881
            - containerPort: 50000
              protocol: UDP
          volumeMounts:
            - name: config
              mountPath: /etc/livekit
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            tcpSocket:
              port: 7880
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 7880
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: kzys-livekit-config
---
apiVersion: v1
kind: Service
metadata:
  # Not named "livekit" — that injects LIVEKIT_PORT=tcp://... and breaks the server.
  name: kzys-livekit
  namespace: kzys
  labels:
    app: livekit
spec:
  selector:
    app: livekit
  ports:
    - name: signal
      port: 7880
      targetPort: 7880
    - name: rtc-tcp
      port: 7881
      targetPort: 7881
