# LiveKit SFU — hostNetwork so RTC UDP 50000-50100 + TCP 7881 reach the node.
# Requires GKE Standard (not Autopilot) + firewall (see configure-public-ips.ps1).
# Signaling for browsers still goes through kzys-web HTTPS /livekit proxy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  labels:
    app: livekit
    app.kubernetes.io/part-of: project-k
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: livekit
  template:
    metadata:
      labels:
        app: livekit
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      enableServiceLinks: false
      initContainers:
        - name: wait-redis
          image: redis:7-alpine
          command:
            - sh
            - -c
            - until redis-cli -h redis ping | grep -q PONG; do echo waiting-for-redis; sleep 2; done
      containers:
        - name: livekit
          image: livekit/livekit-server:v1.9.12
          args:
            - --config
            - /etc/livekit/livekit.yaml
            - --keys
            - "$(LIVEKIT_API_KEY): $(LIVEKIT_API_SECRET)"
          env:
            - name: LIVEKIT_PORT
              value: "7880"
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kzys-secrets
                  key: LIVEKIT_API_KEY
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: kzys-secrets
                  key: LIVEKIT_API_SECRET
          ports:
            - name: signal
              containerPort: 7880
              hostPort: 7880
              protocol: TCP
            - name: rtc-tcp
              containerPort: 7881
              hostPort: 7881
              protocol: TCP
            - name: rtc-udp
              containerPort: 50000
              hostPort: 50000
              protocol: UDP
          volumeMounts:
            - name: config
              mountPath: /etc/livekit
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "4"
              memory: 4Gi
          readinessProbe:
            tcpSocket:
              port: 7880
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 7880
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: kzys-livekit-config
---
apiVersion: v1
kind: Service
metadata:
  # Not named "livekit" — that injects LIVEKIT_PORT=tcp://... and breaks the server.
  name: kzys-livekit
  labels:
    app: livekit
spec:
  selector:
    app: livekit
  ports:
    - name: signal
      port: 7880
      targetPort: 7880
    - name: rtc-tcp
      port: 7881
      targetPort: 7881
