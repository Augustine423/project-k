# LiveKit SFU — hostNetwork for WebRTC on GKE; scale replicas later for more capacity.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit-sfu
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: livekit-sfu
  template:
    metadata:
      labels:
        app: livekit-sfu
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: livekit-sfu
        image: livekit/livekit-server:v1.9.9
        imagePullPolicy: IfNotPresent
        args: ["--config", "/etc/livekit/livekit.yaml"]
        ports:
        - containerPort: 7880
        - containerPort: 7881
        volumeMounts:
        - name: config
          mountPath: /etc/livekit
          readOnly: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          tcpSocket:
            port: 7880
          initialDelaySeconds: 20
          periodSeconds: 20
        readinessProbe:
          tcpSocket:
            port: 7880
          initialDelaySeconds: 15
          periodSeconds: 10
      volumes:
      - name: config
        configMap:
          name: livekit-config
