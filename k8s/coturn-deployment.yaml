apiVersion: v1
kind: ConfigMap
metadata:
  name: coturn-config
data:
  turnserver.conf: |
    listening-port=3478
    fingerprint
    lt-cred-mech
    user=kzys:kzyspass123
    realm=kzys.local
    log-file=stdout
    no-tls
    no-dtls
    no-cli
    max-bps=1000000
    total-quota=1000
    bps-capacity=0
    stale-nonce=600
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kzys-coturn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kzys-coturn
  template:
    metadata:
      labels:
        app: kzys-coturn
    spec:
      containers:
      - name: coturn
        image: coturn/coturn:latest
        args: ["-c", "/etc/coturn/turnserver.conf"]
        ports:
        - containerPort: 3478
          protocol: UDP
        - containerPort: 3478
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /etc/coturn
        resources:
          requests:
            memory: "128Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
      volumes:
      - name: config
        configMap:
          name: coturn-config
---
apiVersion: v1
kind: Service
metadata:
  name: kzys-coturn
spec:
  type: NodePort
  # ClientIP affinity keeps a given client's UDP packets on the same pod
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  selector:
    app: kzys-coturn
  ports:
  - name: turn-udp
    port: 3478
    targetPort: 3478
    protocol: UDP
    nodePort: 30478
  - name: turn-tcp
    port: 3478
    targetPort: 3478
    protocol: TCP
    nodePort: 30479
