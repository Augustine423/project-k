apiVersion: apps/v1
kind: Deployment
metadata:
  name: kzys-backend-go
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kzys-backend-go
  template:
    metadata:
      labels:
        app: kzys-backend-go
    spec:
      containers:
      - name: backend-go
        image: kyawzayarsoe/backend-go:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: LIVEKIT_API_KEY
          valueFrom:
            secretKeyRef:
              name: livekit-secrets
              key: api-key
        - name: LIVEKIT_API_SECRET
          valueFrom:
            secretKeyRef:
              name: livekit-secrets
              key: api-secret
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
