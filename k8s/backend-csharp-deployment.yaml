apiVersion: apps/v1
kind: Deployment
metadata:
  name: kzys-backend-csharp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kzys-backend-csharp
  template:
    metadata:
      labels:
        app: kzys-backend-csharp
    spec:
      initContainers:
      - name: wait-for-livekit
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z livekit-sfu 7880; do echo waiting for livekit-sfu; sleep 2; done']
      containers:
      - name: backend-csharp
        image: kyawzayarsoe/backend-csharp:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: LIVEKIT_API_KEY
          valueFrom:
            secretKeyRef:
              name: livekit-secrets
              key: api-key
        - name: LIVEKIT_API_SECRET
          valueFrom:
            secretKeyRef:
              name: livekit-secrets
              key: api-secret
        - name: REDIS_URL
          value: "kzys-redis:6379"
        - name: CORS_ORIGIN
          value: ""
        - name: LIVEKIT_URL
          value: "http://livekit-sfu:7880"
        - name: MAX_PARTICIPANTS_PER_ROOM
          value: "50"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 15
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kzys-backend-csharp
spec:
  selector:
    app: kzys-backend-csharp
  ports:
  - name: http
    port: 8080
    targetPort: 8080
