apiVersion: v1
kind: ConfigMap
metadata:
  name: janus-config
data:
  janus.jcfg: |
    general: {
      configs_folder = "/usr/local/etc/janus"
      plugins_folder = "/usr/local/lib/janus/plugins"
      transports_folder = "/usr/local/lib/janus/transports"
      debug_level = 4
      admin_secret = "janusoverlord"
    }
    nat: {
      stun_server = "stun.l.google.com"
      stun_port = 19302
    }
  janus.plugin.videoroom.jcfg: |
    general: {
      admin_key = "kzysjanusadmin"
    }
  janus.transport.http.jcfg: |
    general: {
      json = "compact"
      base_path = "/janus"
      http = true
      port = 8088
    }
    admin: {
      admin_base_path = "/admin"
      admin_http = true
      admin_port = 7088
    }
  janus.transport.websockets.jcfg: |
    general: {
      json = "compact"
      ws = true
      ws_port = 8188
      wss = false
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: janus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: janus
  template:
    metadata:
      labels:
        app: janus
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: janus
        image: canyan/janus-gateway:latest
        args: ["/usr/local/bin/janus", "-F", "/usr/local/etc/janus"]
        ports:
        - containerPort: 8088
          protocol: TCP
        - containerPort: 8188
          protocol: TCP
        - containerPort: 7088
          protocol: TCP
        - containerPort: 20000
          protocol: UDP
        volumeMounts:
        - name: config
          mountPath: /usr/local/etc/janus/janus.jcfg
          subPath: janus.jcfg
        - name: config
          mountPath: /usr/local/etc/janus/janus.plugin.videoroom.jcfg
          subPath: janus.plugin.videoroom.jcfg
        - name: config
          mountPath: /usr/local/etc/janus/janus.transport.http.jcfg
          subPath: janus.transport.http.jcfg
        - name: config
          mountPath: /usr/local/etc/janus/janus.transport.websockets.jcfg
          subPath: janus.transport.websockets.jcfg
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
      volumes:
      - name: config
        configMap:
          name: janus-config
---
apiVersion: v1
kind: Service
metadata:
  name: janus
spec:
  type: ClusterIP
  selector:
    app: janus
  ports:
  - name: http
    port: 8088
    targetPort: 8088
    protocol: TCP
  - name: ws
    port: 8188
    targetPort: 8188
    protocol: TCP
  - name: admin
    port: 7088
    targetPort: 7088
    protocol: TCP
