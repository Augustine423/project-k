apiVersion: apps/v1
kind: Deployment
metadata:
  name: kzys-backend-csharp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kzys-backend-csharp
  template:
    metadata:
      labels:
        app: kzys-backend-csharp
    spec:
      containers:
      - name: backend-csharp
        image: kyawzayarsoe/backend-csharp:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: LIVEKIT_API_KEY
          valueFrom:
            secretKeyRef:
              name: livekit-secrets
              key: api-key
        - name: LIVEKIT_API_SECRET
          valueFrom:
            secretKeyRef:
              name: livekit-secrets
              key: api-secret
        - name: REDIS_URL
          value: "kzys-redis:6379"
        - name: ASPNETCORE_ENVIRONMENT
          value: "Development"
        - name: LIVEKIT_URL
          value: "http://livekit-sfu:7880"
        - name: KZYS_DB_PATH
          value: "/app/data/kzys.db"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        volumeMounts:
        - name: billing-data
          mountPath: /app/data
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 15
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: billing-data
        emptyDir: {}
