apiVersion: apps/v1
kind: Deployment
metadata:
  name: kzys-backend-csharp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kzys-backend-csharp
  template:
    metadata:
      labels:
        app: kzys-backend-csharp
    spec:
      containers:
      - name: backend-csharp
        image: kyawzayarsoe/backend-csharp:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: KZYS_DB_PATH
          value: "/app/data/kzys.db"
        - name: JANUS_ADMIN_URL
          value: "http://janus:7088/admin"
        - name: JANUS_ADMIN_SECRET
          value: "janusoverlord"
        - name: TURN_USERNAME
          valueFrom:
            secretKeyRef:
              name: turn-secrets
              key: username
        - name: TURN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: turn-secrets
              key: password
        - name: TURN_PORT
          value: "30478"
        - name: REDIS_URL
          value: "kzys-redis:6379"
        - name: ASPNETCORE_ENVIRONMENT
          value: "Development"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        volumeMounts:
        - name: billing-data
          mountPath: /app/data
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 15
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: billing-data
        emptyDir: {}
