apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-config
data:
  livekit.yaml: |
    port: 7880
    keys:
      devkey: devsecret_devsecret_devsecret_32ch
    redis:
      address: kzys-redis:6379
    rtc:
      use_external_ip: true
      tcp_port: 7881
      port_range_start: 50000
      port_range_end: 50100
      allow_tcp_fallback: true
    logging:
      level: info
