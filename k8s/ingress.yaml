apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kzys-ingress-frontend
  annotations:
    nginx.ingress.kubernetes.io/websocket-services: "kzys-frontend"
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kzys-frontend
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kzys-ingress-backend
  annotations:
    nginx.ingress.kubernetes.io/websocket-services: "kzys-backend-csharp"
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: kzys-backend-csharp
            port:
              number: 8080
