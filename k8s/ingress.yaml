apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kzys-ingress
  annotations:
    nginx.ingress.kubernetes.io/websocket-services: "kzys-backend-go"
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kzys-frontend
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: kzys-backend-go
            port:
              number: 8080
      - path: /ws
        pathType: Prefix
        backend:
          service:
            name: kzys-backend-go
            port:
              number: 8080
