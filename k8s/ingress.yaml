apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kzys-ingress
  annotations:
    nginx.ingress.kubernetes.io/websocket-services: "kzys-backend"
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kzys-frontend
            port:
              number: 80
      - path: /ws
        pathType: Prefix
        backend:
          service:
            name: kzys-backend
            port:
              number: 8080
