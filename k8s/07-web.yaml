# Frontend nginx on LoadBalancer :80/:443 (NOT Vite :5173).
# Self-signed cert from image entrypoint + PUBLIC_HOST SAN (cam/mic need HTTPS).
# Open https://<WEB_LB_IP>/ and accept the browser warning.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kzys-web
  labels:
    app: kzys-web
    app.kubernetes.io/part-of: project-k
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kzys-web
  template:
    metadata:
      labels:
        app: kzys-web
    spec:
      containers:
        - name: web
          image: kyawzayarsoe/project-k-web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443
          env:
            # Used by docker-entrypoint.sh to stamp cert SAN (IP or DNS).
            - name: PUBLIC_HOST
              valueFrom:
                configMapKeyRef:
                  name: kzys-app-config
                  key: PUBLIC_HOST
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: tls
              mountPath: /etc/nginx/tls
          readinessProbe:
            httpGet:
              path: /
              port: 443
              scheme: HTTPS
            periodSeconds: 5
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 443
              scheme: HTTPS
            periodSeconds: 15
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: nginx-config
          configMap:
            name: kzys-web-nginx
        - name: tls
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kzys-web
  labels:
    app: kzys-web
  annotations:
    cloud.google.com/l4-rbs: "enabled"
    networking.gke.io/load-balancer-type: "External"
spec:
  type: LoadBalancer
  selector:
    app: kzys-web
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 443
