# Frontend + path proxy. HTTPS LoadBalancer with self-signed cert (no domain).
# Open https://<LB_IP>/ and accept the browser warning — required for camera/mic.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kzys-web
  namespace: kzys
  labels:
    app: kzys-web
    app.kubernetes.io/part-of: project-k
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kzys-web
  template:
    metadata:
      labels:
        app: kzys-web
    spec:
      initContainers:
        - name: gen-selfsigned-tls
          image: alpine/openssl:3.3.3
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              openssl req -x509 -nodes -newkey rsa:2048 -days 825 \
                -keyout /tls/tls.key -out /tls/tls.crt \
                -subj "/CN=kzys-gke-test" \
                -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          volumeMounts:
            - name: tls
              mountPath: /tls
      containers:
        - name: web
          image: kyawzayarsoe/project-k-web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: tls
              mountPath: /etc/nginx/tls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 443
              scheme: HTTPS
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 443
              scheme: HTTPS
            periodSeconds: 15
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: nginx-config
          configMap:
            name: kzys-web-nginx
        - name: tls
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kzys-web
  namespace: kzys
  labels:
    app: kzys-web
  annotations:
    cloud.google.com/l4-rbs: "enabled"
    networking.gke.io/load-balancer-type: "External"
spec:
  type: LoadBalancer
  selector:
    app: kzys-web
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 443
