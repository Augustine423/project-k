# C++ media-core — Janus room mode orchestrator (applies publisher caps via Admin API).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kzys-media-core
  namespace: kzys
  labels:
    app: kzys-media-core
    app.kubernetes.io/part-of: project-k
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kzys-media-core
  template:
    metadata:
      labels:
        app: kzys-media-core
    spec:
      # Burst-friendly scheduling: Autopilot/Karpenter can add nodes when
      # Janus StatefulSet scales and media-core load signals spike.
      priorityClassName: system-cluster-critical
      containers:
        - name: media-core
          image: kyawzayarsoe/project-k-media-core:latest
          imagePullPolicy: Always
          env:
            - name: REDIS_URL
              value: redis://redis.kzys.svc.cluster.local:6379
            - name: JANUS_ADMIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: kzys-secrets
                  key: JANUS_ADMIN_SECRET
            - name: JANUS_NODES
              valueFrom:
                configMapKeyRef:
                  name: kzys-app-config
                  key: JANUS_NODES
            - name: MEDIA_CORE_POLL_MS
              value: "1000"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
