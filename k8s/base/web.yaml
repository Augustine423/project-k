# Static React frontend — built with Vite, served by nginx.
# Stateless: any replica can serve any request, HPA scales freely.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kzys-web
  namespace: kzys
  labels:
    app: kzys-web
    app.kubernetes.io/part-of: project-k
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kzys-web
  template:
    metadata:
      labels:
        app: kzys-web
    spec:
      containers:
        - name: web
          image: kyawzayarsoe/project-k-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 15
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kzys-web
  namespace: kzys
  labels:
    app: kzys-web
spec:
  selector:
    app: kzys-web
  ports:
    - name: http
      port: 80
      targetPort: 80
---
# HPA: scale 1→5 replicas on CPU. Web is pure static files served by nginx
# so each replica is very lightweight (~25m CPU idle).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kzys-web-hpa
  namespace: kzys
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kzys-web
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
