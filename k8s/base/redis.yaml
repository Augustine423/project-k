# Redis — single StatefulSet with persistent SSD storage.
# Room state and participant presence are stored here. Not horizontally
# scaled (Redis Cluster is overkill at this scale; a single fast instance
# handles 100,000+ ops/sec). Use managed Cloud Memorystore for production HA.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: kzys
  labels:
    app: redis
    app.kubernetes.io/part-of: project-k
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - redis-server
            - "--appendonly"
            - "yes"
            - "--maxmemory"
            - "200mb"
            - "--maxmemory-policy"
            - "allkeys-lru"
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # GKE SSD storage class — faster than HDD for Redis AOF writes.
        # "standard-rwo" = pd-balanced (default GKE, good for testing).
        # Switch to "premium-rwo" (pd-ssd) for production low-latency.
        storageClassName: "standard-rwo"
        resources:
          requests:
            storage: 5Gi
---
# Headless service — gives each StatefulSet pod stable DNS.
# Control plane connects via: redis://redis.kzys.svc.cluster.local:6379
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: kzys
  labels:
    app: redis
spec:
  clusterIP: None
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
