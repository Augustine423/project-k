# Go control plane — runtime env from ConfigMap + Secret (never baked in Docker image).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kzys-control-plane
  namespace: kzys
  labels:
    app: kzys-control-plane
    app.kubernetes.io/part-of: project-k
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kzys-control-plane
  template:
    metadata:
      labels:
        app: kzys-control-plane
    spec:
      containers:
        - name: api
          image: kyawzayarsoe/project-k-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: REDIS_URL
              value: redis://redis.kzys.svc.cluster.local:6379
            - name: LIVEKIT_INTERNAL_URL
              value: ws://livekit.kzys.svc.cluster.local:7880
            - name: JWT_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: kzys-secrets
                  key: JWT_SIGNING_SECRET
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kzys-secrets
                  key: LIVEKIT_API_KEY
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: kzys-secrets
                  key: LIVEKIT_API_SECRET
            - name: TURN_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: kzys-secrets
                  key: TURN_SHARED_SECRET
            - name: LIVEKIT_URL
              valueFrom:
                configMapKeyRef:
                  name: kzys-app-config
                  key: LIVEKIT_URL
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: kzys-app-config
                  key: CORS_ORIGIN
            - name: TURN_HOST
              valueFrom:
                configMapKeyRef:
                  name: kzys-app-config
                  key: TURN_HOST
            - name: TURN_PORT
              valueFrom:
                configMapKeyRef:
                  name: kzys-app-config
                  key: TURN_PORT
            - name: TURN_TLS_PORT
              valueFrom:
                configMapKeyRef:
                  name: kzys-app-config
                  key: TURN_TLS_PORT
            - name: TURN_USE_TLS
              valueFrom:
                configMapKeyRef:
                  name: kzys-app-config
                  key: TURN_USE_TLS
            - name: MAX_ROOM_PARTICIPANTS
              valueFrom:
                configMapKeyRef:
                  name: kzys-app-config
                  key: MAX_ROOM_PARTICIPANTS
            - name: SERVICE_NAME
              valueFrom:
                configMapKeyRef:
                  name: kzys-app-config
                  key: SERVICE_NAME
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 4000
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kzys-control-plane
  namespace: kzys
  labels:
    app: kzys-control-plane
spec:
  selector:
    app: kzys-control-plane
  ports:
    - name: http
      port: 4000
      targetPort: 4000
