# C# ASP.NET control plane — room registry, LiveKit tokens, Redis-backed WebSocket hub.
# Stateless: chat/events fan out via Redis pub/sub — no Gateway sticky sessions required.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kzys-control-plane
  namespace: kzys
  labels:
    app: kzys-control-plane
    app.kubernetes.io/part-of: project-k
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kzys-control-plane
  template:
    metadata:
      labels:
        app: kzys-control-plane
    spec:
      containers:
        - name: api
          # C# backend image — built from backend-csharp/Dockerfile
          image: kyawzayarsoe/project-k-csharp:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: REDIS_URL
              value: redis://redis.kzys.svc.cluster.local:6379
            - name: JWT_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: kzys-secrets
                  key: JWT_SIGNING_SECRET
            - name: TURN_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: kzys-secrets
                  key: TURN_SHARED_SECRET
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kzys-secrets
                  key: LIVEKIT_API_KEY
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: kzys-secrets
                  key: LIVEKIT_API_SECRET
            - name: LIVEKIT_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: kzys-app-config
                  key: LIVEKIT_PUBLIC_URL
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: kzys-app-config
                  key: CORS_ORIGIN
            - name: TURN_HOST
              valueFrom:
                configMapKeyRef:
                  name: kzys-app-config
                  key: TURN_HOST
            - name: TURN_PORT
              valueFrom:
                configMapKeyRef:
                  name: kzys-app-config
                  key: TURN_PORT
            - name: TURN_TLS_PORT
              valueFrom:
                configMapKeyRef:
                  name: kzys-app-config
                  key: TURN_TLS_PORT
            - name: TURN_USE_TLS
              valueFrom:
                configMapKeyRef:
                  name: kzys-app-config
                  key: TURN_USE_TLS
            - name: MAX_ROOM_PARTICIPANTS
              valueFrom:
                configMapKeyRef:
                  name: kzys-app-config
                  key: MAX_ROOM_PARTICIPANTS
            - name: WEBINAR_ENTER_LISTENERS
              valueFrom:
                configMapKeyRef:
                  name: kzys-app-config
                  key: WEBINAR_ENTER_LISTENERS
            - name: WEBINAR_ENTER_RATIO
              valueFrom:
                configMapKeyRef:
                  name: kzys-app-config
                  key: WEBINAR_ENTER_RATIO
            - name: WEBINAR_EXIT_LISTENERS
              valueFrom:
                configMapKeyRef:
                  name: kzys-app-config
                  key: WEBINAR_EXIT_LISTENERS
            - name: INTERACTIVE_MAX_PUBLISHERS
              valueFrom:
                configMapKeyRef:
                  name: kzys-app-config
                  key: INTERACTIVE_MAX_PUBLISHERS
            - name: WEBINAR_MAX_PUBLISHERS
              valueFrom:
                configMapKeyRef:
                  name: kzys-app-config
                  key: WEBINAR_MAX_PUBLISHERS
            - name: SERVICE_NAME
              valueFrom:
                configMapKeyRef:
                  name: kzys-app-config
                  key: SERVICE_NAME
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kzys-control-plane
  namespace: kzys
  labels:
    app: kzys-control-plane
spec:
  selector:
    app: kzys-control-plane
  ports:
    - name: http
      port: 4000
      targetPort: 4000
---
# Scaling: KEDA control-plane-scaler (keda/scaledobjects.yaml) handles replica count.
# Do not add an HPA on the same Deployment — KEDA and HPA conflict.
