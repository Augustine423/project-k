apiVersion: v1
kind: ConfigMap
metadata:
  name: coturn-config
  namespace: kzys
  labels:
    app.kubernetes.io/part-of: project-k
data:
  turnserver.conf: |
    listening-port=3478
    tls-listening-port=5349
    use-auth-secret
    min-port=20000
    max-port=20050
    no-tls
    no-dtls
    fingerprint
    lt-cred-mech
    no-multicast-peers
    no-cli
    log-file=stdout
    verbose
