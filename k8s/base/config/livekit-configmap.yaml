# LiveKit SFU config — secrets via LIVEKIT_KEYS env, not this file.
apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-config
  namespace: kzys
  labels:
    app.kubernetes.io/part-of: project-k
data:
  livekit.yaml: |
    port: 7880
    bind_addresses:
      - ""
    rtc:
      tcp_port: 7881
      port_range_start: 51000
      port_range_end: 51030
      use_external_ip: true
      allow_tcp_fallback: true
      congestion_control:
        enabled: true
        allow_pause: true
    redis:
      address: redis.kzys.svc.cluster.local:6379
    room:
      auto_create: true
      empty_timeout: 300
      max_participants: 10
    logging:
      level: info
