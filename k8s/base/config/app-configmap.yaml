# Non-secret runtime configuration for GKE.
# Replace all CHANGE_ME placeholders before applying.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kzys-app-config
  namespace: kzys
  labels:
    app.kubernetes.io/part-of: project-k
data:
  # ── Public hostname ────────────────────────────────────────────────────────
  # The GKE Gateway (ALB) hostname — set this to your real domain.
  APP_HOST: "app.CHANGE_ME.example.com"

  # ── CORS ───────────────────────────────────────────────────────────────────
  CORS_ORIGIN: "https://app.CHANGE_ME.example.com"

  # ── Service identity ───────────────────────────────────────────────────────
  SERVICE_NAME: "kzys-control-plane"

  # ── Room limits ────────────────────────────────────────────────────────────
  # Light profile (2 vCPU / 4 GB single node, ~200 users audio+chat, camera off default):
  #   one webinar room, 8 speakers + ~192 listeners, or several smaller rooms.
  MAX_ROOM_PARTICIPANTS: "200"

  # ── Room mode auto-switch (interactive ↔ webinar) ─────────────────────────
  # Switch to webinar early so most users are audio/chat listeners (light on CPU).
  WEBINAR_ENTER_LISTENERS: "15"
  WEBINAR_ENTER_RATIO: "2.0"
  WEBINAR_EXIT_LISTENERS: "10"
  INTERACTIVE_MAX_PUBLISHERS: "200"
  WEBINAR_MAX_PUBLISHERS: "8"

  # ── TURN / coturn ──────────────────────────────────────────────────────────
  # Set TURN_HOST to the NLB external IP created by coturn-nlb.yaml overlay.
  TURN_HOST: "CHANGE_ME_COTURN_NLB_IP"
  TURN_PORT: "3478"
  TURN_TLS_PORT: "5349"
  TURN_USE_TLS: "false"
  TURN_REALM: "kzys"

  # ── Janus media nodes ─────────────────────────────────────────────────────
  # Format: nodeId|adminHttpURL|internalWsURL|publicWsURL
  # Add more nodes separated by commas for horizontal scaling.
  # internalWsURL  = in-cluster ClusterIP service (used by control plane)
  # publicWsURL    = browser-facing URL (NLB IP or domain + path via Gateway)
  #
  # Single node example (expand with more janus-N entries as you scale):
  JANUS_NODES: "janus-1|http://janus.kzys.svc.cluster.local:7088/admin|ws://janus.kzys.svc.cluster.local:8188|wss://app.CHANGE_ME.example.com/janus"

  # ── Janus RTP port ranges ─────────────────────────────────────────────────
  # Must match the ports exposed on the Janus NLB overlay.
  JANUS_RTP_PORT_RANGE: "10000-11000"
  JANUS_STREAMING_PORT_RANGE: "15000-15200"
