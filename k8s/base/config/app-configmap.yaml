# Non-secret runtime configuration for GKE.
# Replace all CHANGE_ME placeholders before applying.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kzys-app-config
  namespace: kzys
  labels:
    app.kubernetes.io/part-of: project-k
data:
  # ── Public hostname ────────────────────────────────────────────────────────
  # The GKE Gateway (ALB) hostname — set this to your real domain.
  APP_HOST: "app.CHANGE_ME.example.com"

  # ── CORS ───────────────────────────────────────────────────────────────────
  CORS_ORIGIN: "https://app.CHANGE_ME.example.com"

  # ── Service identity ───────────────────────────────────────────────────────
  SERVICE_NAME: "kzys-control-plane"

  # ── Room limits ────────────────────────────────────────────────────────────
  # Scaled GKE profile: up to 10k joins per room (webinar-style audiences).
  # Interactive still caps cam/mic publishers; large rooms auto-switch toward webinar.
  MAX_ROOM_PARTICIPANTS: "10000"
  LARGE_ROOM_EVENT_THRESHOLD: "200"
  PARTICIPANTS_PAGE_SIZE: "50"
  PARTICIPANTS_SEARCH_SCAN_CAP: "3000"

  # ── Room mode auto-switch (interactive ↔ webinar) ─────────────────────────
  # Flip to webinar before publisher pressure grows in large rooms.
  WEBINAR_ENTER_LISTENERS: "45"
  WEBINAR_ENTER_RATIO: "2.0"
  WEBINAR_EXIT_LISTENERS: "20"
  INTERACTIVE_MAX_PUBLISHERS: "50"
  WEBINAR_MAX_PUBLISHERS: "16"

  # ── TURN / coturn ──────────────────────────────────────────────────────────
  # Set TURN_HOST to the NLB external IP created by coturn-nlb.yaml overlay.
  TURN_HOST: "CHANGE_ME_COTURN_NLB_IP"
  TURN_PORT: "3478"
  TURN_TLS_PORT: "5349"
  TURN_USE_TLS: "false"
  TURN_REALM: "kzys"

  # ── LiveKit SFU ────────────────────────────────────────────────────────────
  LIVEKIT_PUBLIC_URL: "wss://app.CHANGE_ME.example.com/livekit"
  LIVEKIT_RTC_UDP_PORT_RANGE: "50000-50100"
