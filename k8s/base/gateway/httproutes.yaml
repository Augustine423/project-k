# Path-based routing on APP_HOST via GKE Gateway (ALB).
# All traffic arrives at the Gateway; routes forward to the right service.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kzys-api
  namespace: kzys
  labels:
    app.kubernetes.io/part-of: project-k
spec:
  parentRefs:
    - name: kzys-gateway
      sectionName: https
    - name: kzys-gateway
      sectionName: http
  hostnames:
    - app.CHANGE_ME.example.com
  rules:
    # REST API
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: kzys-control-plane
          port: 4000
    # Room WebSocket (presence / chat / host controls)
    - matches:
        - path:
            type: PathPrefix
            value: /ws
      backendRefs:
        - name: kzys-control-plane
          port: 4000
    # SignalR hub (C# realtime events — used by RoomEventHub)
    - matches:
        - path:
            type: PathPrefix
            value: /meetinghub
      backendRefs:
        - name: kzys-control-plane
          port: 4000
    # Health / readiness probes (also used by GKE health check policy)
    - matches:
        - path:
            type: PathPrefix
            value: /health
      backendRefs:
        - name: kzys-control-plane
          port: 4000
    - matches:
        - path:
            type: PathPrefix
            value: /ready
      backendRefs:
        - name: kzys-control-plane
          port: 4000
---
# Janus WebSocket signaling — browser connects here for WebRTC negotiation.
# The Gateway strips /janus prefix and forwards to Janus WS port 8188.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kzys-janus
  namespace: kzys
  labels:
    app.kubernetes.io/part-of: project-k
spec:
  parentRefs:
    - name: kzys-gateway
      sectionName: https
    - name: kzys-gateway
      sectionName: http
  hostnames:
    - app.CHANGE_ME.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /janus
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: janus
          port: 8188
---
# Static web frontend — catch-all, must be last.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kzys-web
  namespace: kzys
  labels:
    app.kubernetes.io/part-of: project-k
spec:
  parentRefs:
    - name: kzys-gateway
      sectionName: https
    - name: kzys-gateway
      sectionName: http
  hostnames:
    - app.CHANGE_ME.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kzys-web
          port: 80
