# TLS for Gateway HTTPS listener. Replace with your cert or use Google Certificate Manager.
apiVersion: v1
kind: Secret
metadata:
  name: kzys-tls
  namespace: kzys
  labels:
    app.kubernetes.io/part-of: project-k
type: kubernetes.io/tls
stringData:
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_FULL_CHAIN
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_PRIVATE_KEY
    -----END PRIVATE KEY-----
