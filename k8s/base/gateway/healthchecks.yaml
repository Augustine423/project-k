apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: control-plane-hc
  namespace: kzys
  labels:
    app.kubernetes.io/part-of: project-k
spec:
  default:
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    config:
      type: HTTP
      httpHealthCheck:
        requestPath: /ready
        port: 4000
  targetRef:
    group: ""
    kind: Service
    name: kzys-control-plane
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: web-hc
  namespace: kzys
  labels:
    app.kubernetes.io/part-of: project-k
spec:
  default:
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    config:
      type: HTTP
      httpHealthCheck:
        requestPath: /
        port: 80
  targetRef:
    group: ""
    kind: Service
    name: kzys-web
