# Janus WebRTC Gateway — StatefulSet so each pod gets a stable identity
# (janus-0, janus-1 …) matching the JANUS_NODES config map entries.
#
# Networking:
#   ClusterIP service (port 8188 WS, 7088 admin) — used by control plane internally.
#   NLB UDP service — exposes RTP media ports 10000-11000 directly to the internet.
#   Gateway HTTPRoute /janus — proxies browser WS signaling over HTTPS/WSS.
#
# Scaling:
#   KEDA ScaledObject (keda/scaledobjects.yaml) scales this StatefulSet
#   based on Redis node load counters written by the C# control plane.
#   Each pod handles ~30-50 active conference rooms or ~400 concurrent viewers.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: janus
  namespace: kzys
  labels:
    app: janus
    app.kubernetes.io/part-of: project-k
spec:
  serviceName: janus
  replicas: 1
  selector:
    matchLabels:
      app: janus
  template:
    metadata:
      labels:
        app: janus
    spec:
      # Use host networking so Janus can resolve its own public IP for ICE
      # candidates without NAT confusion. Required for WebRTC on GKE.
      hostNetwork: false
      containers:
        - name: janus
          image: kyawzayarsoe/project-k-janus:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8088
              protocol: TCP
            - name: admin
              containerPort: 7088
              protocol: TCP
            - name: ws
              containerPort: 8188
              protocol: TCP
          env:
            - name: JANUS_NODE_ID
              # Stable pod identity: janus-0, janus-1 … matches JANUS_NODES config.
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: JANUS_ADMIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: kzys-secrets
                  key: JANUS_ADMIN_SECRET
            - name: JANUS_VIDEOROOM_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: kzys-secrets
                  key: JANUS_VIDEOROOM_ADMIN_KEY
            - name: JANUS_CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: kzys-app-config
                  key: CORS_ORIGIN
            - name: JANUS_RTP_PORT_RANGE
              valueFrom:
                configMapKeyRef:
                  name: kzys-app-config
                  key: JANUS_RTP_PORT_RANGE
            - name: JANUS_STREAMING_PORT_RANGE
              valueFrom:
                configMapKeyRef:
                  name: kzys-app-config
                  key: JANUS_STREAMING_PORT_RANGE
            - name: STUN_SERVER
              value: "stun.l.google.com"
          readinessProbe:
            httpGet:
              path: /janus/info
              port: 8088
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /janus/info
              port: 8088
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 1000m
              memory: 1Gi
            limits:
              cpu: 4000m
              memory: 4Gi
---
# ── Internal ClusterIP service ────────────────────────────────────────────────
# Used by the control plane to reach Janus admin API and WS API in-cluster.
# Not exposed externally — browser WS goes through Gateway /janus route.
apiVersion: v1
kind: Service
metadata:
  name: janus
  namespace: kzys
  labels:
    app: janus
spec:
  clusterIP: None       # headless — gives each pod its own DNS (janus-0.janus…)
  selector:
    app: janus
  ports:
    - name: http
      port: 8088
      targetPort: 8088
      protocol: TCP
    - name: admin
      port: 7088
      targetPort: 7088
      protocol: TCP
    - name: ws
      port: 8188
      targetPort: 8188
      protocol: TCP
---
# ── NLB UDP service for RTP media ─────────────────────────────────────────────
# WebRTC media (RTP/RTCP) travels UDP directly browser ↔ Janus.
# This NLB passes UDP packets straight through to the pods — no proxying.
# GKE will provision a Network Load Balancer with a static external IP.
#
# After apply, get the IP:
#   kubectl get svc janus-media-nlb -n kzys
# Then set JANUS_NODES in app-configmap.yaml with this IP as the NLB address.
apiVersion: v1
kind: Service
metadata:
  name: janus-media-nlb
  namespace: kzys
  labels:
    app: janus
  annotations:
    # GKE NLB — pass-through L4, no bandwidth limit at the LB layer.
    networking.gke.io/load-balancer-type: "External"
    cloud.google.com/load-balancer-type: "External"
spec:
  type: LoadBalancer
  selector:
    app: janus
  ports:
    # WebSocket port — also exposed here as fallback for non-Gateway setups
    - name: ws
      port: 8188
      targetPort: 8188
      protocol: TCP
    # RTP media port range for WebRTC PeerConnections.
    # Must match JANUS_RTP_PORT_RANGE in app-configmap.yaml (10000-11000).
    # Open matching UDP range in GCP firewall after deploy.
    - name: rtp-10000
      port: 10000
      targetPort: 10000
      protocol: UDP
