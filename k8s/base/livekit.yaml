# LiveKit SFU â€” internal ClusterIP for Gateway signaling; UDP via overlays/gke/livekit-nlb.yaml.
# UDP containerPorts 50000-59000 generated by k8s/scripts/generate-media-ports.ps1
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  namespace: kzys
  labels:
    app: livekit
    app.kubernetes.io/part-of: project-k
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: livekit
  template:
    metadata:
      labels:
        app: livekit
    spec:
      containers:
        - name: livekit
          image: kyawzayarsoe/project-k-livekit:latest
          imagePullPolicy: Always
          args: ["--config", "/etc/livekit.yaml"]
          env:
            - name: LIVEKIT_KEYS
              valueFrom:
                secretKeyRef:
                  name: kzys-secrets
                  key: LIVEKIT_KEYS
            - name: NODE_IP
              valueFrom:
                configMapKeyRef:
                  name: kzys-app-config
                  key: MEDIA_NODE_IP
