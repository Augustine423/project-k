apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-config-init
data:
  init.sh: |
    #!/bin/sh
    set -eu
    cat > /config/livekit.yaml <<EOF
    port: 7880
    keys:
      ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
    rtc:
      use_external_ip: false
      stun_servers:
        - stun.l.google.com:19302
      turn_servers:
        - host: ${TURN_HOST}
          port: 3478
          protocol: udp
          username: ${TURN_USERNAME}
          credential: ${TURN_PASSWORD}
      tcp_port: 7881
      port_range_start: 50000
      port_range_end: 50100
      allow_tcp_fallback: true
    logging:
      level: info
    EOF
    chmod 644 /config/livekit.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coturn-config-init
data:
  init.sh: |
    #!/bin/sh
    set -eu
    cat > /config/turnserver.conf <<EOF
    listening-port=3478
    listening-ip=0.0.0.0
    external-ip=${EXTERNAL_IP}
    fingerprint
    lt-cred-mech
    user=${TURN_USERNAME}:${TURN_PASSWORD}
    realm=${TURN_REALM}
    log-file=stdout
    no-tls
    no-dtls
    no-cli
    max-bps=1000000
    total-quota=1000
    bps-capacity=0
    stale-nonce=600
    EOF
    chmod 644 /config/turnserver.conf
