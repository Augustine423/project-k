# ClusterIP — browsers reach LiveKit signaling via frontend nginx at /rtc
apiVersion: v1
kind: Service
metadata:
  name: livekit-sfu
spec:
  type: ClusterIP
  selector:
    app: livekit-sfu
  ports:
  - name: rtc-ws
    port: 7880
    targetPort: 7880
  - name: rtc-tcp
    port: 7881
    targetPort: 7881
