# Coturn — hostNetwork so TURN relay UDP 20000-20100 is reachable (needed for stress/NAT).
# TURN_HOST must be the node external IP (configure-public-ips.ps1 sets it).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coturn
  labels:
    app: coturn
    app.kubernetes.io/part-of: project-k
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: coturn
  template:
    metadata:
      labels:
        app: coturn
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: coturn
          image: coturn/coturn:4.6.2
          args:
            - "-c"
            - "/etc/coturn/turnserver.conf"
            - "--realm=$(TURN_REALM)"
            - "--static-auth-secret=$(TURN_SHARED_SECRET)"
            - "--external-ip=$(TURN_HOST)"
          env:
            - name: TURN_REALM
              valueFrom:
                configMapKeyRef:
                  name: kzys-app-config
                  key: TURN_REALM
            - name: TURN_HOST
              valueFrom:
                configMapKeyRef:
                  name: kzys-app-config
                  key: TURN_HOST
            - name: TURN_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: kzys-secrets
                  key: TURN_SHARED_SECRET
          ports:
            - name: turn-udp
              containerPort: 3478
              hostPort: 3478
              protocol: UDP
            - name: turn-tcp
              containerPort: 3478
              hostPort: 3478
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 3478
            periodSeconds: 10
            initialDelaySeconds: 5
          livenessProbe:
            tcpSocket:
              port: 3478
            periodSeconds: 20
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/coturn
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: coturn-config
---
# ClusterIP only — browsers reach TURN via node external IP (hostNetwork), not this Service.
apiVersion: v1
kind: Service
metadata:
  name: coturn
  labels:
    app: coturn
spec:
  selector:
    app: coturn
  ports:
    - name: turn-udp
      port: 3478
      targetPort: 3478
      protocol: UDP
    - name: turn-tcp
      port: 3478
      targetPort: 3478
      protocol: TCP
