apiVersion: v1
kind: ConfigMap
metadata:
  name: coturn-config-init
data:
  init.sh: |
    #!/bin/sh
    set -eu
    cat > /config/turnserver.conf <<EOF
    listening-port=3478
    listening-ip=0.0.0.0
    external-ip=${EXTERNAL_IP}
    fingerprint
    lt-cred-mech
    user=${TURN_USERNAME}:${TURN_PASSWORD}
    realm=${TURN_REALM}
    log-file=stdout
    no-tls
    no-dtls
    no-cli
    EOF
    chmod 644 /config/turnserver.conf
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kzys-coturn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kzys-coturn
  template:
    metadata:
      labels:
        app: kzys-coturn
    spec:
      initContainers:
      - name: config-init
        image: busybox:1.36
        command: ["sh", "/scripts/init.sh"]
        env:
        - name: TURN_USERNAME
          valueFrom:
            secretKeyRef:
              name: turn-secrets
              key: username
        - name: TURN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: turn-secrets
              key: password
        - name: TURN_REALM
          valueFrom:
            secretKeyRef:
              name: turn-secrets
              key: realm
        - name: EXTERNAL_IP
          valueFrom:
            configMapKeyRef:
              name: kzys-gcp-endpoints
              key: turn-host
        volumeMounts:
        - name: config
          mountPath: /config
        - name: init-scripts
          mountPath: /scripts
      containers:
      - name: coturn
        image: coturn/coturn:latest
        args: ["-c", "/etc/coturn/turnserver.conf"]
        ports:
        - containerPort: 3478
          protocol: UDP
        - containerPort: 3478
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /etc/coturn
      volumes:
      - name: config
        emptyDir: {}
      - name: init-scripts
        configMap:
          name: coturn-config-init
          defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: kzys-coturn
spec:
  type: LoadBalancer
  selector:
    app: kzys-coturn
  ports:
  - name: turn-udp
    port: 3478
    targetPort: 3478
    protocol: UDP
  - name: turn-tcp
    port: 3478
    targetPort: 3478
    protocol: TCP
