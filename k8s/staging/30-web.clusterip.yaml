# Frontend pods — ClusterIP only. Public HTTP(S) is the ALB Ingress.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kzys-web
  namespace: meetingmax-staging
  labels:
    app: kzys-web
    app.kubernetes.io/part-of: project-k
    app.kubernetes.io/env: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kzys-web
  template:
    metadata:
      labels:
        app: kzys-web
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: kzys-web
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: kzys-web
      containers:
        - name: web
          image: kyawzayarsoe/project-k-web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          env:
            - name: PUBLIC_HOST
              valueFrom:
                configMapKeyRef:
                  name: kzys-app-config
                  key: PUBLIC_HOST
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: tls
              mountPath: /etc/nginx/tls
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 15
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: nginx-config
          configMap:
            name: kzys-web-nginx
        - name: tls
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kzys-web
  namespace: meetingmax-staging
  labels:
    app: kzys-web
    project-k.io/lb: clusterip
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "kzys-web-alb"}'
spec:
  type: ClusterIP
  selector:
    app: kzys-web
  ports:
    - name: http
      port: 80
      targetPort: 80
