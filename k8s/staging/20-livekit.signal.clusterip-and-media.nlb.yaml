# LiveKit: ClusterIP for WS signal (ALB → nginx → here).
#           NLB for RTC TCP 7881 + one UDP media port (staging).
# HPA 2–6. Prefer one pod per node. ICE still uses LIVEKIT_MEDIA_IP = NLB IP
# (best-effort staging). Per-node public IPs are the production ICE model.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  namespace: meetingmax-staging
  labels:
    app: livekit
    app.kubernetes.io/part-of: project-k
    app.kubernetes.io/env: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: livekit
  template:
    metadata:
      labels:
        app: livekit
    spec:
      enableServiceLinks: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: livekit
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: livekit
      initContainers:
        - name: wait-redis
          image: redis:7-alpine
          command:
            - sh
            - -c
            - until redis-cli -h redis ping | grep -q PONG; do echo waiting-for-redis; sleep 2; done
      containers:
        - name: livekit
          image: livekit/livekit-server:v1.9.12
          args:
            - --config
            - /etc/livekit/livekit.yaml
            - --keys
            - "$(LIVEKIT_API_KEY): $(LIVEKIT_API_SECRET)"
            - --node-ip
            - $(LIVEKIT_MEDIA_IP)
          env:
            - name: LIVEKIT_PORT
              value: "7880"
            - name: LIVEKIT_MEDIA_IP
              valueFrom:
                configMapKeyRef:
                  name: kzys-app-config
                  key: LIVEKIT_MEDIA_IP
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kzys-secrets
                  key: LIVEKIT_API_KEY
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: kzys-secrets
                  key: LIVEKIT_API_SECRET
          ports:
            - name: signal
              containerPort: 7880
              protocol: TCP
            - name: rtc-tcp
              containerPort: 7881
              protocol: TCP
            - name: rtc-udp
              containerPort: 50000
              protocol: UDP
          volumeMounts:
            - name: config
              mountPath: /etc/livekit
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            tcpSocket:
              port: 7880
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 7880
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: kzys-livekit-config
---
apiVersion: v1
kind: Service
metadata:
  name: kzys-livekit
  namespace: meetingmax-staging
  labels:
    app: livekit
    project-k.io/lb: clusterip
spec:
  type: ClusterIP
  selector:
    app: livekit
  ports:
    - name: signal
      port: 7880
      targetPort: 7880
---
apiVersion: v1
kind: Service
metadata:
  name: kzys-livekit-nlb
  namespace: meetingmax-staging
  labels:
    app: livekit
    project-k.io/lb: nlb
  annotations:
    cloud.google.com/l4-rbs: "enabled"
    networking.gke.io/load-balancer-type: "External"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: livekit
  ports:
    - name: rtc-tcp
      port: 7881
      targetPort: 7881
      protocol: TCP
    - name: rtc-udp
      port: 50000
      targetPort: 50000
      protocol: UDP
