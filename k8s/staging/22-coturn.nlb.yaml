# Coturn: NLB only. Browsers use TURN_HOST = this NLB IP. Never ClusterIP.
# HPA 2–4 across nodes. Same TURN_SHARED_SECRET + NLB IP.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coturn
  namespace: meetingmax-staging
  labels:
    app: coturn
    app.kubernetes.io/part-of: project-k
    app.kubernetes.io/env: staging
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: coturn
  template:
    metadata:
      labels:
        app: coturn
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: coturn
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: coturn
      containers:
        - name: coturn
          image: coturn/coturn:4.6.2
          args:
            - "-c"
            - "/etc/coturn/turnserver.conf"
            - "--realm=$(TURN_REALM)"
            - "--static-auth-secret=$(TURN_SHARED_SECRET)"
            - "--external-ip=$(TURN_HOST)"
          env:
            - name: TURN_REALM
              valueFrom:
                configMapKeyRef:
                  name: kzys-app-config
                  key: TURN_REALM
            - name: TURN_HOST
              valueFrom:
                configMapKeyRef:
                  name: kzys-app-config
                  key: TURN_HOST
            - name: TURN_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: kzys-secrets
                  key: TURN_SHARED_SECRET
          ports:
            - name: turn-udp
              containerPort: 3478
              protocol: UDP
            - name: turn-tcp
              containerPort: 3478
              protocol: TCP
            - name: relay-udp
              containerPort: 20000
              protocol: UDP
          readinessProbe:
            tcpSocket:
              port: 3478
            periodSeconds: 10
            initialDelaySeconds: 5
          livenessProbe:
            tcpSocket:
              port: 3478
            periodSeconds: 20
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/coturn
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: coturn-config
---
apiVersion: v1
kind: Service
metadata:
  name: kzys-coturn-nlb
  namespace: meetingmax-staging
  labels:
    app: coturn
    project-k.io/lb: nlb
  annotations:
    cloud.google.com/l4-rbs: "enabled"
    networking.gke.io/load-balancer-type: "External"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: coturn
  ports:
    - name: turn-udp
      port: 3478
      targetPort: 3478
      protocol: UDP
    - name: turn-tcp
      port: 3478
      targetPort: 3478
      protocol: TCP
    - name: relay-udp
      port: 20000
      targetPort: 20000
      protocol: UDP
