# ALB analogue on GKE = HTTP(S) Ingress.
# AWS: change ingressClassName to alb (AWS Load Balancer Controller).
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: kzys-web-alb
  namespace: meetingmax-staging
  labels:
    app.kubernetes.io/part-of: project-k
    app.kubernetes.io/env: staging
spec:
  timeoutSec: 86400
  connectionDraining:
    drainingTimeoutSec: 60
  healthCheck:
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /
    port: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kzys-frontend-alb
  namespace: meetingmax-staging
  labels:
    app: kzys-web
    project-k.io/lb: alb
    app.kubernetes.io/part-of: project-k
    app.kubernetes.io/env: staging
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.allow-http: "true"
spec:
  defaultBackend:
    service:
      name: kzys-web
      port:
        number: 80
