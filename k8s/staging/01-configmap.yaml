# Staging public addresses — fill after Ingress + NLBs get EXTERNAL-IPs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kzys-app-config
  namespace: meetingmax-staging
  labels:
    app.kubernetes.io/part-of: project-k
    app.kubernetes.io/env: staging
data:
  SERVICE_NAME: "kzys-control-plane"
  CORS_ORIGIN: "*"
  # Staging admission caps are intentionally conservative; they are not capacity claims.
  MAX_ROOM_PARTICIPANTS: "500"
  LARGE_ROOM_EVENT_THRESHOLD: "200"
  PARTICIPANTS_PAGE_SIZE: "50"
  PARTICIPANTS_SEARCH_SCAN_CAP: "500"
  WEBINAR_ENTER_LISTENERS: "400"
  WEBINAR_ENTER_RATIO: "8.0"
  WEBINAR_EXIT_LISTENERS: "50"
  INTERACTIVE_MAX_PUBLISHERS: "50"
  WEBINAR_MAX_PUBLISHERS: "20"
  SFU_PUBLISHERS_PER_NODE: "50"
  KZYS_SFU_STANDBY_POOL: "2"
  # ALB / Ingress host (no scheme)
  PUBLIC_HOST: "CHANGE_ME_ALB_HOST"
  # Coturn NLB IP (browsers use this, never ClusterIP)
  TURN_HOST: "CHANGE_ME_COTURN_NLB_IP"
  TURN_PORT: "3478"
  TURN_TLS_PORT: "5349"
  TURN_USE_TLS: "false"
  TURN_REALM: "kzys-staging"
  # LiveKit media NLB IP (--node-ip / ICE)
  LIVEKIT_MEDIA_IP: "CHANGE_ME_LIVEKIT_NLB_IP"
  # Signal stays same-origin via ALB → nginx → ClusterIP
  LIVEKIT_PUBLIC_URL: "wss://CHANGE_ME_ALB_HOST/livekit"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kzys-livekit-config
  namespace: meetingmax-staging
  labels:
    app.kubernetes.io/part-of: project-k
    app.kubernetes.io/env: staging
data:
  livekit.yaml: |
    port: 7880
    bind_addresses:
      - ""
    rtc:
      tcp_port: 7881
      # Narrow range — also published on the media NLB for staging.
      port_range_start: 50000
      port_range_end: 50000
      use_external_ip: false
      enable_loopback_candidate: false
    redis:
      address: redis:6379
    room:
      empty_timeout: 300
      departure_timeout: 20
    logging:
      level: info
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coturn-config
  namespace: meetingmax-staging
  labels:
    app.kubernetes.io/part-of: project-k
    app.kubernetes.io/env: staging
data:
  turnserver.conf: |
    listening-port=3478
    tls-listening-port=5349
    use-auth-secret
    min-port=20000
    max-port=20000
    no-tls
    no-dtls
    fingerprint
    lt-cred-mech
    no-multicast-peers
    no-cli
    log-file=stdout
    verbose
---
# Path routing stays in nginx; ALB only forwards :80/:443 to this config.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kzys-web-nginx
  namespace: meetingmax-staging
  labels:
    app.kubernetes.io/part-of: project-k
    app.kubernetes.io/env: staging
data:
  default.conf: |
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            proxy_pass http://kzys-control-plane:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws/ {
            proxy_pass http://kzys-control-plane:4000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        location /health {
            proxy_pass http://kzys-control-plane:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /ready {
            proxy_pass http://kzys-control-plane:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /livekit/ {
            proxy_pass http://kzys-livekit:7880/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
