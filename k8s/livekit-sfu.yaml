# LiveKit SFU — secrets via init container; warm pool via KEDA minReplicaCount=1.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit-sfu
  labels:
    kzys.io/tier: spot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: livekit-sfu
  template:
    metadata:
      labels:
        app: livekit-sfu
        kzys.io/tier: spot
    spec:
      initContainers:
      - name: config-init
        image: busybox:1.36
        command: ["sh", "/scripts/init.sh"]
        env:
        - name: LIVEKIT_API_KEY
          valueFrom:
            secretKeyRef:
              name: livekit-secrets
              key: api-key
        - name: LIVEKIT_API_SECRET
          valueFrom:
            secretKeyRef:
              name: livekit-secrets
              key: api-secret
        - name: TURN_USERNAME
          valueFrom:
            secretKeyRef:
              name: turn-secrets
              key: username
        - name: TURN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: turn-secrets
              key: password
        volumeMounts:
        - name: config
          mountPath: /config
        - name: init-scripts
          mountPath: /scripts
      containers:
      - name: livekit-sfu
        image: livekit/livekit-server:latest
        args:
        - --config
        - /etc/livekit/livekit.yaml
        env:
        - name: LIVEKIT_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        ports:
        - name: rtc-ws
          containerPort: 7880
        - name: rtc-tcp
          containerPort: 7881
        - name: rtc-udp
          containerPort: 7882
          protocol: UDP
        volumeMounts:
        - name: config
          mountPath: /etc/livekit
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          tcpSocket:
            port: 7880
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          tcpSocket:
            port: 7880
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: config
        emptyDir: {}
      - name: init-scripts
        configMap:
          name: livekit-config-init
          defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: livekit-sfu
spec:
  type: LoadBalancer
  selector:
    app: livekit-sfu
  ports:
  - name: rtc-ws
    port: 7880
    targetPort: 7880
  - name: rtc-tcp
    port: 7881
    targetPort: 7881
    protocol: TCP
  - name: rtc-udp
    port: 7882
    targetPort: 7882
    protocol: UDP
