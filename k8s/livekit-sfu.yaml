apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit-sfu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: livekit-sfu
  template:
    metadata:
      labels:
        app: livekit-sfu
    spec:
      containers:
      - name: livekit-sfu
        image: livekit/livekit-server:latest
        args:
        - --config
        - /etc/livekit/livekit.yaml
        ports:
        - name: rtc-ws
          containerPort: 7880
        - name: rtc-tcp
          containerPort: 7881
        - name: rtc-udp
          containerPort: 7882
          protocol: UDP
        volumeMounts:
        - name: config
          mountPath: /etc/livekit
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          tcpSocket:
            port: 7880
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          tcpSocket:
            port: 7880
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: config
        configMap:
          name: livekit-sfu-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-sfu-config
data:
  livekit.yaml: |
    port: 7880
    keys:
      devkey: devsecret-devsecret-devsecret-12
    rtc:
      stun_servers:
        - "stun:stun.l.google.com:19302"
      tcp_port: 7881
      udp_port: 7882
    logging:
      level: info
---
apiVersion: v1
kind: Service
metadata:
  name: livekit-sfu
spec:
  type: NodePort
  selector:
    app: livekit-sfu
  ports:
  - name: rtc-ws
    port: 7880
    targetPort: 7880
    nodePort: 30780
  - name: rtc-tcp
    port: 7881
    targetPort: 7881
    nodePort: 30781
    protocol: TCP
  - name: rtc-udp
    port: 7882
    targetPort: 7882
    nodePort: 30782
    protocol: UDP
