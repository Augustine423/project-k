apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit-sfu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: livekit-sfu
  template:
    metadata:
      labels:
        app: livekit-sfu
    spec:
      containers:
      - name: livekit-sfu
        image: livekit/livekit-server:latest
        args:
        - --dev
        - --config
        - /etc/livekit/livekit.yaml
        ports:
        - name: rtc
          containerPort: 7880
        volumeMounts:
        - name: config
          mountPath: /etc/livekit
      volumes:
      - name: config
        configMap:
          name: livekit-sfu-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-sfu-config
data:
  livekit.yaml: |
    port: 7880
    keys:
      devkey: devsecret-devsecret-devsecret-12
    rtc:
      stun_servers:
        - "stun:stun.l.google.com:19302"
---
apiVersion: v1
kind: Service
metadata:
  name: livekit-sfu
spec:
  type: NodePort
  selector:
    app: livekit-sfu
  ports:
  - name: rtc
    port: 7880
    targetPort: 7880
    nodePort: 30780
