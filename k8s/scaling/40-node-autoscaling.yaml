# Karpenter (AWS) example. On GKE/AKS use node-pool autoscaling with the same labels/taints
# (workload=livekit, network-optimised instances, no overcommit).
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: livekit
spec:
  template:
    metadata:
      labels: { workload: livekit }
    spec:
      taints:
        - { key: workload, value: livekit, effect: NoSchedule }
      requirements:
        - { key: karpenter.sh/capacity-type, operator: In, values: ["on-demand"] }  # never spot for SFU
        - { key: node.kubernetes.io/instance-type, operator: In, values: ["c6in.2xlarge", "c6in.4xlarge", "c7gn.4xlarge"] }
      nodeClassRef: { group: karpenter.k8s.aws, kind: EC2NodeClass, name: livekit }
      expireAfter: Never                      # don't recycle nodes mid-meeting
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30m
  limits:
    cpu: "1000"
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: app
spec:
  template:
    metadata:
      labels: { workload: app }
    spec:
      requirements:
        - { key: karpenter.sh/capacity-type, operator: In, values: ["on-demand", "spot"] }
        - { key: node.kubernetes.io/instance-type, operator: In, values: ["m6i.large", "m6i.xlarge"] }
      nodeClassRef: { group: karpenter.k8s.aws, kind: EC2NodeClass, name: default }
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
  limits:
    cpu: "200"
---
# Keep a little warm headroom so a join burst doesn't wait ~60 s for a node.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: overprovision
value: -10
globalDefault: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: overprovision
spec:
  replicas: 1
  selector: { matchLabels: { app: overprovision } }
  template:
    metadata:
      labels: { app: overprovision }
    spec:
      priorityClassName: overprovision
      nodeSelector: { workload: livekit }
      tolerations:
        - { key: workload, operator: Equal, value: livekit, effect: NoSchedule }
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.9
          resources: { requests: { cpu: "6", memory: 8Gi } }
