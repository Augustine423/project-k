apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-k-web
  labels:
    app: project-k-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: project-k-web
  template:
    metadata:
      labels:
        app: project-k-web
    spec:
      containers:
        - name: web
          image: kyawzayarsoe/project-k-web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443
          readinessProbe:
            httpGet:
              path: /
              port: https
              scheme: HTTPS
          livenessProbe:
            httpGet:
              path: /
              port: https
              scheme: HTTPS
---
apiVersion: v1
kind: Service
metadata:
  name: project-k-web
spec:
  type: ClusterIP
  selector:
    app: project-k-web
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: https
      port: 443
      targetPort: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  labels:
    app: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      containers:
        - name: server
          image: kyawzayarsoe/project-k-csharp:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: REDIS_URL
              value: redis-ha-0.redis-ha:26379,redis-ha-1.redis-ha:26379,redis-ha-2.redis-ha:26379,serviceName=mymaster
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: server
spec:
  type: ClusterIP
  selector:
    app: server
  ports:
    - name: http
      port: 4000
      targetPort: http
