apiVersion: apps/v1
kind: Deployment
metadata:
  name: kzys-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kzys-redis
  template:
    metadata:
      labels:
        app: kzys-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kzys-redis
spec:
  selector:
    app: kzys-redis
  ports:
  - port: 6379
    targetPort: 6379
