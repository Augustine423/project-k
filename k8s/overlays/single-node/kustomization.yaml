# Single-node light profile (~2 vCPU / 4 GB VM).
# Target: ~200 users in one webinar-style room — audio + chat, camera off by default.
#
# Apply: kubectl apply -k k8s/overlays/single-node
#
# Janus stays a StatefulSet (stable pod name for JANUS_NODES config) but runs
# as 1 replica on a small node. C# control plane is stateless (Redis pub/sub).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      kind: StatefulSet
      name: janus
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 1200m
            memory: 1536Mi
          limits:
            cpu: 1800m
            memory: 2560Mi
  - target:
      kind: Deployment
      name: kzys-control-plane
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 384Mi
  - target:
      kind: StatefulSet
      name: redis
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 250m
            memory: 192Mi
