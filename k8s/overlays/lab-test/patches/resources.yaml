apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  namespace: kzys
spec:
  template:
    spec:
      containers:
        - name: livekit
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1500m
              memory: 1536Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kzys-control-plane
  namespace: kzys
spec:
  template:
    spec:
      containers:
        - name: api
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: kzys
spec:
  template:
    spec:
      containers:
        - name: redis
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 192Mi
