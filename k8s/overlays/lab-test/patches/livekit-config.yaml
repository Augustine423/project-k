apiVersion: v1
kind: ConfigMap
metadata:
  name: kzys-livekit-config
  namespace: kzys
data:
  livekit.yaml: |
    port: 7880
    bind_addresses:
      - ""
    rtc:
      tcp_port: 7881
      port_range_start: 50000
      port_range_end: 50100
      use_external_ip: true
      enable_loopback_candidate: false
    keys:
      devkey: dev-livekit-local-secret-32chars-min
    redis:
      address: redis.kzys.svc.cluster.local:6379
    logging:
      level: info
