apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Dev/test — no DNS, no manual secrets, node IP auto-detect for TURN + LiveKit.
#   kubectl apply -k k8s/overlays/dev
#   powershell -File k8s/deploy-dev.ps1

resources:
- ../../base

secretGenerator:
- name: livekit-secrets
  literals:
  - api-key=devkey
  - api-secret=devsecret_devsecret_devsecret_32ch
- name: turn-secrets
  literals:
  - username=kzys
  - password=kzys-turn-dev
  - realm=kzys-dev

generatorOptions:
  disableNameSuffixHash: true
