apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  namespace: kzys
spec:
  template:
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: livekit
          ports:
            - name: signal
              containerPort: 7880
              hostPort: 7880
              protocol: TCP
            - name: rtc-tcp
              containerPort: 7881
              hostPort: 7881
              protocol: TCP
