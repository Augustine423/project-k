apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: control-plane-scaler
  namespace: kzys
spec:
  minReplicaCount: 2
  maxReplicaCount: 30
  cooldownPeriod: 60
  triggers:
    - type: redis
      metadata:
        address: redis.kzys.svc.cluster.local:6379
        keyName: kzys:room_count
        activationValue: "1"
        targetValue: "5"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: livekit-scaler
  namespace: kzys
spec:
  minReplicaCount: 2
  maxReplicaCount: 50
  cooldownPeriod: 60
  pollingInterval: 10
  triggers:
    - type: redis
      metadata:
        address: redis.kzys.svc.cluster.local:6379
        keyName: kzys:total_node_load
        activationValue: "2"
        targetValue: "8"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: web-scaler
  namespace: kzys
spec:
  minReplicaCount: 2
  maxReplicaCount: 20
  cooldownPeriod: 30
  triggers:
    - type: redis
      metadata:
        address: redis.kzys.svc.cluster.local:6379
        keyName: kzys:room_count
        activationValue: "1"
        targetValue: "15"
