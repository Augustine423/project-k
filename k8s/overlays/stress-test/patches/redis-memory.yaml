apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: kzys
spec:
  template:
    spec:
      containers:
        - name: redis
          command:
            - redis-server
            - "--appendonly"
            - "yes"
            - "--maxmemory"
            - "2gb"
            - "--maxmemory-policy"
            - "allkeys-lru"
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2560Mi
