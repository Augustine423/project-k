# Stress-test overlay — aggressive KEDA thresholds, PostgreSQL, higher caps.
#
# Prerequisites:
#   - KEDA installed (helm install keda kedacore/keda -n keda --create-namespace)
#   - Secrets applied (k8s/secrets.example.yaml → secrets.yaml)
#   - Patch APP_HOST / TURN_HOST in config before apply
#
# Apply:
#   kubectl apply -k k8s/overlays/stress-test
#
# Monitor scaling:
#   kubectl get scaledobject -n kzys
#   redis-cli GET kzys:room_count
#   redis-cli GET kzys:total_node_load
#   curl https://APP_HOST/api/rooms/scaling/metrics

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - postgres.yaml
  - livekit-udp-service.yaml

patches:
  - path: patches/keda-scalers.yaml
  - path: patches/control-plane-env.yaml
  - path: patches/redis-memory.yaml
  - path: patches/livekit-resources.yaml
  - path: patches/livekit-hostnetwork.yaml
