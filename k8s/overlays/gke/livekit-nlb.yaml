# GKE external passthrough NLB for LiveKit WebRTC media (UDP) + RTC TCP fallback.
# After apply: kubectl get svc livekit-media -n kzys -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
# Set that IP in kzys-app-config MEDIA_NODE_IP and re-apply control-plane.
apiVersion: v1
kind: Service
metadata:
  name: livekit-media
  namespace: kzys
  labels:
    app: livekit
    app.kubernetes.io/part-of: project-k
  annotations:
    cloud.google.com/l4-rbs: "enabled"
    networking.gke.io/load-balancer-type: "External"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: livekit
  ports:
    - name: rtc-tcp
      port: 7881
      targetPort: 7881
      protocol: TCP
    - name: rtc-udp-51000
      port: 51000
      targetPort: 51000
      protocol: UDP
    - name: rtc-udp-51001
      port: 51001
      targetPort: 51001
      protocol: UDP
