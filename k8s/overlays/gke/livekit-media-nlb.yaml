# GKE external NLB for LiveKit signaling (TCP) + RTC TCP.
# UDP media (50000-50100) must be opened on node firewall / separate UDP LB.
# Apply with: kubectl apply -k k8s/overlays/gke
apiVersion: v1
kind: Service
metadata:
  name: livekit-media
  namespace: kzys
  labels:
    app: livekit
    app.kubernetes.io/part-of: project-k
  annotations:
    cloud.google.com/l4-rbs: "enabled"
    networking.gke.io/load-balancer-type: "External"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: livekit
  ports:
    - name: signal
      port: 7880
      targetPort: 7880
      protocol: TCP
    - name: rtc-tcp
      port: 7881
      targetPort: 7881
      protocol: TCP
