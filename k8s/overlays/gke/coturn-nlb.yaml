# GKE external passthrough NLB for Coturn STUN/TURN (UDP/TCP + relay range).
apiVersion: v1
kind: Service
metadata:
  name: coturn-media
  namespace: kzys
  labels:
    app: coturn
    app.kubernetes.io/part-of: project-k
  annotations:
    cloud.google.com/l4-rbs: "enabled"
    networking.gke.io/load-balancer-type: "External"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: coturn
  ports:
    - name: turn-udp
      port: 3478
      targetPort: 3478
      protocol: UDP
    - name: turn-tcp
      port: 3478
      targetPort: 3478
      protocol: TCP
