# GKE burst scaling notes for Project-K media tier (10k+ webinar-capable rooms).
#
# GKE Autopilot (recommended):
#   - Autopilot adds nodes when LiveKit pods request higher CPU/memory.
#   - LiveKit requests are sized for high fan-out (see base/livekit.yaml).
#
# GKE Standard + Node auto-provisioning:
#   - KEDA ScaledObject (keda/scaledobjects.yaml) drives LiveKit replica count
#     from kzys:total_node_load in Redis (1→30).
#
apiVersion: v1
kind: ConfigMap
metadata:
  name: kzys-burst-scaling-notes
  namespace: kzys
  labels:
    app.kubernetes.io/part-of: project-k
data:
  README: |
    Per-room join cap: 10,000 (MAX_ROOM_PARTICIPANTS).
    Webinar stage: ≤16 publishers (WEBINAR_MAX_PUBLISHERS).
    Interactive: ≤50 publishers (INTERACTIVE_MAX_PUBLISHERS); large rooms
    auto-switch toward webinar so the SFU is not asked for thousands of cams.

    LiveKit scales 1→30 pods via KEDA on kzys:total_node_load.
    Control plane scales 1→20 on kzys:room_count.
    UI downloads ≤25 camera streams per gallery page; off-page stays audio.

    Ops checklist for a 10k webinar:
      - Enough Autopilot/Standard nodes for LiveKit CPU at peak
      - TURN NLB + UDP port ranges reachable from clients
      - LIVEKIT_PUBLIC_URL on the Gateway /livekit path (WSS)
      - Monitor Redis memory (presence for large rooms)
