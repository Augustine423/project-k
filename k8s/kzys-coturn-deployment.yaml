apiVersion: apps/v1
kind: Deployment
metadata:
  name: kzys-coturn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kzys-coturn
  template:
    metadata:
      labels:
        app: kzys-coturn
        kzys.io/tier: spot
    spec:
      # Dev: bind TURN on the node; NodePort 30478/30479 still works cluster-wide.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      initContainers:
      - name: config-init
        image: busybox:1.36
        command: ["sh", "/scripts/init.sh"]
        env:
        - name: TURN_USERNAME
          valueFrom:
            secretKeyRef:
              name: turn-secrets
              key: username
        - name: TURN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: turn-secrets
              key: password
        - name: TURN_REALM
          valueFrom:
            secretKeyRef:
              name: turn-secrets
              key: realm
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        volumeMounts:
        - name: config
          mountPath: /config
        - name: init-scripts
          mountPath: /scripts
      containers:
      - name: coturn
        image: coturn/coturn:latest
        args: ["-c", "/etc/coturn/turnserver.conf"]
        ports:
        - containerPort: 3478
          protocol: UDP
        - containerPort: 3478
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /etc/coturn
        resources:
          requests:
            memory: "128Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
      volumes:
      - name: config
        emptyDir: {}
      - name: init-scripts
        configMap:
          name: coturn-config-init
          defaultMode: 0755
