apiVersion: v1
kind: ConfigMap
metadata:
  name: janus-config
data:
  janus.jcfg: |
    general: {
      configs_folder = "/usr/local/etc/janus"
      plugins_folder = "/usr/local/lib/janus/plugins"
      transports_folder = "/usr/local/lib/janus/transports"
      events_folder = "/usr/local/lib/janus/events"
      loggers_folder = "/usr/local/lib/janus/loggers"
      debug_level = 4
      admin_secret = "janusoverlord"
    }
    media: {
      rtp_port_range = "10000-10200"
    }
    nat: {
      stun_server = "stun.l.google.com"
      stun_port = 19302
      nice_debug = false
      full_trickle = true
      ignore_mdns = true
    }
  janus.transport.websockets.jcfg: |
    general: {
      json = "indented"
      ws = true
      ws_port = 8188
      wss = false
    }
  janus.transport.http.jcfg: |
    general: {
      json = "indented"
      base_path = "/janus"
      http = true
      port = 8088
      https = false
    }
  janus.plugin.videoroom.jcfg: |
    general: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kzys-janus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kzys-janus
  template:
    metadata:
      labels:
        app: kzys-janus
    spec:
      hostNetwork: false
      containers:
      - name: janus
        image: canyan/janus-gateway:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8088
          protocol: TCP
        - containerPort: 8188
          protocol: TCP
        - containerPort: 10000
          protocol: UDP
        - containerPort: 10200
          protocol: UDP
        env:
        - name: MY_POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        volumeMounts:
        - name: janus-config
          mountPath: /usr/local/etc/janus/janus.jcfg
          subPath: janus.jcfg
        - name: janus-config
          mountPath: /usr/local/etc/janus/janus.transport.websockets.jcfg
          subPath: janus.transport.websockets.jcfg
        - name: janus-config
          mountPath: /usr/local/etc/janus/janus.transport.http.jcfg
          subPath: janus.transport.http.jcfg
        - name: janus-config
          mountPath: /usr/local/etc/janus/janus.plugin.videoroom.jcfg
          subPath: janus.plugin.videoroom.jcfg
        resources:
          requests:
            memory: "256Mi"
            cpu: "500m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
        livenessProbe:
          tcpSocket:
            port: 8088
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          tcpSocket:
            port: 8088
          initialDelaySeconds: 10
          periodSeconds: 15
      volumes:
      - name: janus-config
        configMap:
          name: janus-config
---
apiVersion: v1
kind: Service
metadata:
  name: kzys-janus
spec:
  type: NodePort
  selector:
    app: kzys-janus
  ports:
  - name: http
    port: 8088
    targetPort: 8088
    protocol: TCP
    nodePort: 30088
  - name: ws
    port: 8188
    targetPort: 8188
    protocol: TCP
    nodePort: 30188
