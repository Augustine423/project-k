apiVersion: apps/v1
kind: Deployment
metadata:
  name: kzys-janus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kzys-janus
  template:
    metadata:
      labels:
        app: kzys-janus
    spec:
      containers:
      - name: janus
        image: canyan/janus-gateway:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8088   # Janus HTTP API
          protocol: TCP
        - containerPort: 8188   # Janus WebSocket
          protocol: TCP
        - containerPort: 10000  # WebRTC media UDP (start)
          protocol: UDP
        - containerPort: 10200  # WebRTC media UDP (end)
          protocol: UDP
        resources:
          requests:
            memory: "256Mi"
            cpu: "500m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
        livenessProbe:
          tcpSocket:
            port: 8088
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          tcpSocket:
            port: 8088
          initialDelaySeconds: 10
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: kzys-janus
spec:
  type: NodePort
  selector:
    app: kzys-janus
  ports:
  - name: http
    port: 8088
    targetPort: 8088
    protocol: TCP
    nodePort: 30088
  - name: ws
    port: 8188
    targetPort: 8188
    protocol: TCP
    nodePort: 30188
