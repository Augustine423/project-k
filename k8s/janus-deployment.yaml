apiVersion: v1
kind: ConfigMap
metadata:
  name: janus-config
data:
  janus.jcfg: |
    general: {
      configs_folder = "/usr/local/etc/janus"
      plugins_folder = "/usr/local/lib/janus/plugins"
      transports_folder = "/usr/local/lib/janus/transports"
      events_folder = "/usr/local/lib/janus/events"
      loggers_folder = "/usr/local/lib/janus/loggers"
      debug_level = 4
    }
    media: {
      rtp_port_range = "10000-10200"
    }
    nat: {
      stun_server = "stun.l.google.com"
      stun_port = 19302
      full_trickle = true
      ignore_mdns = true
    }
  janus.transport.websockets.jcfg: |
    general: {
      json = "indented"
      ws = true
      ws_port = 8188
      wss = false
    }
  janus.transport.http.jcfg: |
    general: {
      json = "indented"
      base_path = "/janus"
      http = true
      port = 8088
      https = false
    }
  janus.plugin.videoroom.jcfg: |
    general: {}
  start.sh: |
    #!/bin/sh
    # Inject the node IP as nat-1-1 into janus.jcfg
    NODE_IP=$(cat /etc/janus-node-ip/node-ip 2>/dev/null || echo "")
    if [ -n "$NODE_IP" ]; then
      sed -i "s|full_trickle = true|full_trickle = true\n      nat_1_1_mapping = \"$NODE_IP\"|" /usr/local/etc/janus/janus.jcfg
    fi
    exec /usr/local/bin/janus
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kzys-janus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kzys-janus
  template:
    metadata:
      labels:
        app: kzys-janus
    spec:
      initContainers:
      - name: write-node-ip
        image: busybox
        command:
        - sh
        - -c
        - echo $NODE_IP > /node-ip/node-ip
        env:
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        volumeMounts:
        - name: node-ip
          mountPath: /node-ip
      containers:
      - name: janus
        image: canyan/janus-gateway:latest
        imagePullPolicy: Always
        command: ["/bin/sh", "/usr/local/etc/janus/start.sh"]
        ports:
        - containerPort: 8088
          protocol: TCP
        - containerPort: 8188
          protocol: TCP
        - containerPort: 10000
          protocol: UDP
        - containerPort: 10200
          protocol: UDP
        volumeMounts:
        - name: janus-config
          mountPath: /usr/local/etc/janus/janus.jcfg
          subPath: janus.jcfg
        - name: janus-config
          mountPath: /usr/local/etc/janus/janus.transport.websockets.jcfg
          subPath: janus.transport.websockets.jcfg
        - name: janus-config
          mountPath: /usr/local/etc/janus/janus.transport.http.jcfg
          subPath: janus.transport.http.jcfg
        - name: janus-config
          mountPath: /usr/local/etc/janus/janus.plugin.videoroom.jcfg
          subPath: janus.plugin.videoroom.jcfg
        - name: janus-config
          mountPath: /usr/local/etc/janus/start.sh
          subPath: start.sh
        - name: node-ip
          mountPath: /etc/janus-node-ip
        resources:
          requests:
            memory: "256Mi"
            cpu: "500m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
        livenessProbe:
          tcpSocket:
            port: 8088
          initialDelaySeconds: 15
          periodSeconds: 15
        readinessProbe:
          tcpSocket:
            port: 8088
          initialDelaySeconds: 15
          periodSeconds: 15
      volumes:
      - name: janus-config
        configMap:
          name: janus-config
          defaultMode: 0755
      - name: node-ip
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kzys-janus
spec:
  type: NodePort
  selector:
    app: kzys-janus
  ports:
  - name: http
    port: 8088
    targetPort: 8088
    protocol: TCP
    nodePort: 30088
  - name: ws
    port: 8188
    targetPort: 8188
    protocol: TCP
    nodePort: 30188
