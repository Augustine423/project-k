# GKE lab / development sample secrets — same values as .env.example and media/livekit/livekit.yaml.
#
# Quick start (lab only):
#   kubectl apply -f k8s/02-secrets.example.yaml
#
# Or copy to 02-secrets.yaml and customize:
#   copy k8s\02-secrets.example.yaml k8s\02-secrets.yaml
#   kubectl apply -f k8s/
#
# NEVER use these values in production. NEVER commit 02-secrets.yaml with real secrets.
apiVersion: v1
kind: Secret
metadata:
  name: kzys-secrets
  labels:
    app.kubernetes.io/part-of: project-k
type: Opaque
stringData:
  JWT_SIGNING_SECRET: "dev-jwt-signing-secret"
  TURN_SHARED_SECRET: "dev-turn-shared-secret"
  LIVEKIT_API_KEY: "devkey"
  LIVEKIT_API_SECRET: "dev-livekit-local-secret-32chars-min"
