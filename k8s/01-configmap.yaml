# Test config — no domain. After deploy, set LIVEKIT_PUBLIC_URL / TURN_HOST to
# the LoadBalancer IPs, then re-apply this file.
#
# Camera/mic require HTTPS: open https://<WEB_LB_IP>/ and accept the self-signed warning.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kzys-app-config
  namespace: kzys
  labels:
    app.kubernetes.io/part-of: project-k
data:
  SERVICE_NAME: "kzys-control-plane"
  # Use "*" for IP-only test access (no domain / public CA).
  CORS_ORIGIN: "*"
  MAX_ROOM_PARTICIPANTS: "500"
  LARGE_ROOM_EVENT_THRESHOLD: "200"
  PARTICIPANTS_PAGE_SIZE: "50"
  PARTICIPANTS_SEARCH_SCAN_CAP: "3000"
  WEBINAR_ENTER_LISTENERS: "45"
  WEBINAR_ENTER_RATIO: "2.0"
  WEBINAR_EXIT_LISTENERS: "20"
  INTERACTIVE_MAX_PUBLISHERS: "50"
  WEBINAR_MAX_PUBLISHERS: "16"
  # Coturn LB IP: kubectl get svc coturn -n kzys -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
  TURN_HOST: "CHANGE_ME_LB_IP"
  TURN_PORT: "3478"
  TURN_TLS_PORT: "5349"
  TURN_USE_TLS: "false"
  TURN_REALM: "kzys"
  # Web LB IP + wss (must match HTTPS page origin to avoid mixed content):
  # kubectl get svc kzys-web -n kzys -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
  LIVEKIT_PUBLIC_URL: "wss://CHANGE_ME_LB_IP/livekit"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kzys-livekit-config
  namespace: kzys
  labels:
    app.kubernetes.io/part-of: project-k
data:
  # keys.devkey MUST match LIVEKIT_API_SECRET in kzys-secrets.
  # node_ip is set at runtime via --node-ip (see 04-livekit.yaml Deployment).
  livekit.yaml: |
    port: 7880
    bind_addresses:
      - ""
    rtc:
      tcp_port: 7881
      port_range_start: 50000
      port_range_end: 50100
      use_external_ip: false
      enable_loopback_candidate: false
    keys:
      devkey: REPLACE_ME_LIVEKIT_API_SECRET_MIN_32_CHARS
    redis:
      address: redis:6379
    logging:
      level: info
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coturn-config
  namespace: kzys
  labels:
    app.kubernetes.io/part-of: project-k
data:
  turnserver.conf: |
    listening-port=3478
    tls-listening-port=5349
    use-auth-secret
    min-port=20000
    max-port=20100
    no-tls
    no-dtls
    fingerprint
    lt-cred-mech
    no-multicast-peers
    no-cli
    log-file=stdout
    verbose
---
# Nginx — HTTP + HTTPS (self-signed). Same-origin /api /ws /livekit.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kzys-web-nginx
  namespace: kzys
  labels:
    app.kubernetes.io/part-of: project-k
data:
  default.conf: |
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        ssl_certificate     /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location /api/ {
            proxy_pass http://kzys-control-plane:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /ws/ {
            proxy_pass http://kzys-control-plane:4000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400;
        }

        location /health {
            proxy_pass http://kzys-control-plane:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /ready {
            proxy_pass http://kzys-control-plane:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /livekit/ {
            proxy_pass http://kzys-livekit:7880/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
