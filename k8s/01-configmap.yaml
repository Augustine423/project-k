# GKE lab config — no domain, default namespace.
#
# After first apply, run:  powershell -File k8s/configure-public-ips.ps1
# That patches PUBLIC_HOST / TURN_HOST / LIVEKIT_PUBLIC_URL to real IPs,
# then restarts web + coturn + control-plane (self-signed cert SAN + TURN).
#
# UI: https://<WEB_LB_IP>/  (accept self-signed warning — needed for cam/mic)
apiVersion: v1
kind: ConfigMap
metadata:
  name: kzys-app-config
  labels:
    app.kubernetes.io/part-of: project-k
data:
  SERVICE_NAME: "kzys-control-plane"
  CORS_ORIGIN: "*"
  # Target: Zoom Business (300 cam/mic) / Meet Enterprise (1000 in room).
  # One LiveKit room still lives on one SFU node (~100–150 publishers/node realistic).
  MAX_ROOM_PARTICIPANTS: "1000"
  LARGE_ROOM_EVENT_THRESHOLD: "500"
  PARTICIPANTS_PAGE_SIZE: "50"
  PARTICIPANTS_SEARCH_SCAN_CAP: "5000"
  WEBINAR_ENTER_LISTENERS: "400"
  WEBINAR_ENTER_RATIO: "8.0"
  WEBINAR_EXIT_LISTENERS: "50"
  INTERACTIVE_MAX_PUBLISHERS: "300"
  WEBINAR_MAX_PUBLISHERS: "50"
  # SFU autosize hint — used by GET /api/rooms/scaling/metrics (desiredSfuPods).
  SFU_PUBLISHERS_PER_NODE: "100"
  KZYS_SFU_STANDBY_POOL: "2"
  # Filled by configure-public-ips.ps1 (web LoadBalancer IP).
  PUBLIC_HOST: "CHANGE_ME_WEB_LB_IP"
  # Filled by configure-public-ips.ps1 (node external IP — coturn hostNetwork).
  TURN_HOST: "CHANGE_ME_TURN_IP"
  TURN_PORT: "3478"
  TURN_TLS_PORT: "5349"
  TURN_USE_TLS: "false"
  TURN_REALM: "kzys"
  # Same-origin LiveKit via nginx HTTPS proxy (cam/mic secure context).
  LIVEKIT_PUBLIC_URL: "wss://CHANGE_ME_WEB_LB_IP/livekit"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kzys-livekit-config
  labels:
    app.kubernetes.io/part-of: project-k
data:
  # API key/secret come from --keys at runtime (see 04-livekit.yaml), not this file.
  livekit.yaml: |
    port: 7880
    bind_addresses:
      - ""
    rtc:
      tcp_port: 7881
      port_range_start: 50000
      port_range_end: 50999
      use_external_ip: true
      enable_loopback_candidate: false
    redis:
      address: redis:6379
    room:
      empty_timeout: 300
      departure_timeout: 20
    # Distributed SFU — pick least-loaded node (needs Redis + multiple replicas).
    node_selector:
      kind: sysload
      sysload_limit: 0.75
    logging:
      level: info
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coturn-config
  labels:
    app.kubernetes.io/part-of: project-k
data:
  turnserver.conf: |
    listening-port=3478
    tls-listening-port=5349
    use-auth-secret
    min-port=20000
    max-port=20999
    no-tls
    no-dtls
    fingerprint
    lt-cred-mech
    no-multicast-peers
    no-cli
    log-file=stdout
    verbose
---
# Nginx — HTTP→HTTPS + same-origin /api /ws /livekit (not Vite :5173).
apiVersion: v1
kind: ConfigMap
metadata:
  name: kzys-web-nginx
  labels:
    app.kubernetes.io/part-of: project-k
data:
  default.conf: |
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        ssl_certificate     /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location /api/ {
            proxy_pass http://kzys-control-plane:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /ws/ {
            proxy_pass http://kzys-control-plane:4000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400;
        }

        location /health {
            proxy_pass http://kzys-control-plane:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /ready {
            proxy_pass http://kzys-control-plane:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /livekit/ {
            proxy_pass http://kzys-livekit:7880/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
