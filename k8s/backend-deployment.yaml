apiVersion: apps/v1
kind: Deployment
metadata:
  name: kzys-backend-go
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kzys-backend-go
  template:
    metadata:
      labels:
        app: kzys-backend-go
    spec:
      containers:
      - name: backend-go
        image: kyawzayarsoe/backend-go:latest
        imagePullPolicy: Always
        ports:
        - name: rest
          containerPort: 8080
        - name: grpc
          containerPort: 50051
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kzys-backend-go
spec:
  selector:
    app: kzys-backend-go
  ports:
  - name: rest
    port: 8080
    targetPort: 8080
  - name: grpc
    port: 50051
    targetPort: 50051
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kzys-backend-c
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kzys-backend-c
  template:
    metadata:
      labels:
        app: kzys-backend-c
    spec:
      containers:
      - name: backend-c
        image: kyawzayarsoe/backend-c:latest
        imagePullPolicy: Always
        ports:
        - name: grpc
          containerPort: 50051
        resources:
          requests:
            memory: "256Mi"
            cpu: "500m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: kzys-backend-c
spec:
  selector:
    app: kzys-backend-c
  ports:
  - name: grpc
    port: 50051
    targetPort: 50051
