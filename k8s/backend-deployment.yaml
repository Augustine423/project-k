apiVersion: apps/v1
kind: Deployment
metadata:
  name: kzys-backend-csharp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kzys-backend-csharp
  template:
    metadata:
      labels:
        app: kzys-backend-csharp
    spec:
      containers:
      - name: backend-csharp
        image: kyawzayarsoe/backend-csharp:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            memory: "256Mi"
            cpu: "500m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kzys-backend-csharp
spec:
  selector:
    app: kzys-backend-csharp
  ports:
  - name: http
    port: 8080
    targetPort: 8080
