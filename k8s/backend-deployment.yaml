apiVersion: apps/v1
kind: Deployment
metadata:
  name: kzys-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kzys-backend
  template:
    metadata:
      labels:
        app: kzys-backend
    spec:
      containers:
      - name: backend
        image: kyawzayarsoe/kzys-backend:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "256Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: kzys-backend
spec:
  selector:
    app: kzys-backend
  ports:
  - port: 8080
    targetPort: 8080
