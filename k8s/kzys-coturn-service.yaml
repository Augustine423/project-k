apiVersion: v1
kind: Service
metadata:
  name: kzys-coturn
spec:
  type: NodePort
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  selector:
    app: kzys-coturn
  ports:
  - name: turn-udp
    port: 3478
    targetPort: 3478
    protocol: UDP
    nodePort: 30478
  - name: turn-tcp
    port: 3478
    targetPort: 3478
    protocol: TCP
    nodePort: 30479
