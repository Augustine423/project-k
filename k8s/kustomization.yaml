apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Dev/test deploy: kubectl apply -k k8s/
#
# First-time secrets:
#   cp k8s/livekit-secrets.yaml.example k8s/livekit-secrets.yaml
#   cp k8s/turn-secrets.yaml.example k8s/turn-secrets.yaml
#
# Optional (prod scaling, requires KEDA): kubectl apply -f k8s/keda-scaledobject.yaml

resources:
- backend-csharp-deployment.yaml
- frontend-deployment.yaml
- coturn-deployment.yaml
- redis-statefulset.yaml
- livekit-secrets.yaml
- turn-secrets.yaml
- config-init-scripts.yaml
- livekit-hpa.yaml
- ingress.yaml
- livekit-sfu.yaml
- cluster-autoscaler-notes.yaml

patches:
- path: patches/stable-node-placement.yaml
  target:
    kind: Deployment
    name: kzys-backend-csharp
- path: patches/spot-node-placement.yaml
  target:
    kind: Deployment
    name: livekit-sfu
- path: patches/spot-node-placement.yaml
  target:
    kind: Deployment
    name: kzys-coturn

images:
- name: kyawzayarsoe/backend-csharp
  newTag: latest
- name: kyawzayarsoe/frontend
  newTag: latest
