# Apply to worker nodes that should run SFU / Coturn (spot / preemptible).
# Label nodes: kubectl label node <name> kzys.io/node-tier=spot
apiVersion: apps/v1
kind: Deployment
metadata:
  name: _spot_placement_patch
spec:
  template:
    metadata:
      labels:
        kzys.io/placement: spot
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: kzys.io/node-tier
                operator: In
                values: ["spot"]
          - weight: 80
            preference:
              matchExpressions:
              - key: karpenter.sh/capacity-type
                operator: In
                values: ["spot"]
          - weight: 80
            preference:
              matchExpressions:
              - key: cloud.google.com/gke-spot
                operator: In
                values: ["true"]
          - weight: 80
            preference:
              matchExpressions:
              - key: eks.amazonaws.com/capacityType
                operator: In
                values: ["SPOT"]
      tolerations:
      - key: kzys.io/spot
        operator: Equal
        value: "true"
        effect: NoSchedule
      - key: kubernetes.azure.com/scalesetpriority
        operator: Equal
        value: spot
        effect: NoSchedule
      - key: cloud.google.com/gke-spot
        operator: Equal
        value: "true"
        effect: NoSchedule
