# Prefer stable on-demand nodes when labeled (backend, Redis).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: _stable_placement_patch
spec:
  template:
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: kzys.io/node-tier
                operator: In
                values: ["stable"]
      tolerations:
      - key: kzys.io/stable
        operator: Equal
        value: "true"
        effect: NoSchedule
