# Persistent Redis — room state survives pod/node restarts (required for scale-to-zero).
apiVersion: v1
kind: Service
metadata:
  name: kzys-redis
  labels:
    app: kzys-redis
spec:
  ports:
  - port: 6379
    targetPort: 6379
  clusterIP: None
  selector:
    app: kzys-redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kzys-redis
spec:
  serviceName: kzys-redis
  replicas: 1
  selector:
    matchLabels:
      app: kzys-redis
  template:
    metadata:
      labels:
        app: kzys-redis
        kzys.io/tier: stable
    spec:
      # Prefer stable nodes when labeled; still schedules on any node in dev.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: kzys.io/node-tier
                operator: In
                values: ["stable"]
      tolerations:
      - key: kzys.io/stable
        operator: Equal
        value: "true"
        effect: NoSchedule
      containers:
      - name: redis
        image: redis:7-alpine
        args: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
        ports:
        - containerPort: 6379
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "300m"
        volumeMounts:
        - name: redis-data
          mountPath: /data
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 5
          periodSeconds: 10
  volumeClaimTemplates:
  - metadata:
      name: redis-data
    spec:
      accessModes: ["ReadWriteOnce"]
      # Omit storageClassName to use the cluster default StorageClass (standard on minikube/kind/Docker Desktop).
      resources:
        requests:
          storage: 5Gi
