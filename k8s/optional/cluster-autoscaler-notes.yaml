# Example: cluster-autoscaler flags for minimum cost (cloud-specific).
# True "zero nodes" is usually NOT possible — system pods need at least 1 node.
# Use a split node pool: 1 small stable node (Redis, backend) + 0+ spot workers (SFU).
#
# AWS (EKS) — ASG tags on worker node group:
#   k8s.io/cluster-autoscaler/enabled: "true"
#   k8s.io/cluster-autoscaler/<cluster-name>: "owned"
# ASG setting: minSize=0 for spot pool, minSize=1 for stable pool
#
# GKE — node pool autoscaling:
#   min nodes: 0 (spot pool), 1 (stable pool)
#   cluster-autoscaler: --skip-nodes-with-system-pods=false (careful)
#
# Azure AKS:
#   cluster-autoscaler on node pool min-count=0 for spot
#
# Scale-down delay (avoid thrashing when last room ends):
#   --scale-down-unneeded-time=10m
#   --scale-down-delay-after-add=10m
#
apiVersion: v1
kind: ConfigMap
metadata:
  name: kzys-cluster-autoscaler-notes
data:
    README: |
    Warm pool + scale-to-zero layout:
    - KEDA minReplicaCount=1 keeps one standby LiveKit SFU pod (no cold start for first user)
    - desiredSfuPods = max(KZYS_SFU_STANDBY_POOL, activeRooms) from /api/rooms/scaling/metrics
    - Room create publishes kzys:events:room-created and increments room-created counter
    - Stable pool (min=1): Redis StatefulSet + PVC, C# backend, ingress
    - Spot pool (min=0): extra SFU replicas beyond standby, Coturn
    - Cluster Autoscaler removes empty spot nodes after scale-down delay (~10m)
