apiVersion: apps/v1
kind: Deployment
metadata:
  name: kzys-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kzys-frontend
  template:
    metadata:
      labels:
        app: kzys-frontend
    spec:
      containers:
      - name: frontend
        image: kyawzayarsoe/frontend:latest
        ports:
        - containerPort: 80
        env:
        - name: BACKEND_HOST
          value: "kzys-backend-go"
        - name: MEDIA_HOST
          value: "kzys-backend-c"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kzys-frontend
spec:
  type: NodePort
  selector:
    app: kzys-frontend
  ports:
  - name: http
    nodePort: 31498
    port: 80
    protocol: TCP
    targetPort: 80
