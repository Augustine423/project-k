apiVersion: apps/v1
kind: Deployment
metadata:
  name: kzys-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kzys-frontend
  template:
    metadata:
      labels:
        app: kzys-frontend
    spec:
      containers:
      - name: frontend
        image: kyawzayarsoe/kzys-frontend:latest
        ports:
        - containerPort: 80
        env:
        - name: BACKEND_HOST
          value: "kzys-backend"  # Kubernetes Service name
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: kzys-frontend
spec:
  type: NodePort
  selector:
    app: kzys-frontend
  ports:
  - nodePort: 31498
    port: 80
    protocol: TCP
    targetPort: 80
