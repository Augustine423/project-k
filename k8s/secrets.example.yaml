# Copy this to secrets.yaml, fill real values, then:
#   kubectl apply -f k8s/secrets.yaml
#
# NEVER commit secrets.yaml — it is in .gitignore.
apiVersion: v1
kind: Secret
metadata:
  name: kzys-secrets
  namespace: kzys
  labels:
    app.kubernetes.io/part-of: project-k
type: Opaque
stringData:
  JWT_SIGNING_SECRET: "REPLACE_ME_JWT_SECRET_MIN_32_CHARS"
  TURN_SHARED_SECRET: "REPLACE_ME_TURN_SHARED_SECRET"
  LIVEKIT_API_KEY: "devkey"
  LIVEKIT_API_SECRET: "REPLACE_ME_LIVEKIT_API_SECRET_MIN_32_CHARS"
  # Stress-test overlay (k8s/overlays/stress-test) — PostgreSQL for multi-replica control plane
  POSTGRES_PASSWORD: "REPLACE_ME_POSTGRES_PASSWORD"
  DATABASE_URL: "postgresql://kzys:REPLACE_ME_POSTGRES_PASSWORD@postgres.kzys.svc.cluster.local:5432/kzys"
