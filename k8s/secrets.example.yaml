# Copy this to secrets.yaml, fill real values, then:
#   kubectl apply -f k8s/secrets.yaml
#
# NEVER commit secrets.yaml — it is in .gitignore.
# This file (secrets.example.yaml) is safe to commit — values are placeholders.
apiVersion: v1
kind: Secret
metadata:
  name: kzys-secrets
  namespace: kzys
  labels:
    app.kubernetes.io/part-of: project-k
type: Opaque
stringData:
  # ── C# control plane ───────────────────────────────────────────────────────
  # Random 32+ char string — used to sign JWT participant tokens.
  JWT_SIGNING_SECRET: "REPLACE_ME_JWT_SECRET_MIN_32_CHARS"

  # ── TURN / coturn ──────────────────────────────────────────────────────────
  # Shared HMAC secret for coturn time-limited credentials.
  # Must match --static-auth-secret in coturn deployment.
  TURN_SHARED_SECRET: "REPLACE_ME_TURN_SHARED_SECRET"

  # ── Janus WebRTC Gateway ────────────────────────────────────────────────────
  # Admin API secret — used by the control plane to manage Janus over HTTP.
  # Set to a strong random string; must match janus.jcfg admin_secret.
  JANUS_ADMIN_SECRET: "REPLACE_ME_JANUS_ADMIN_SECRET"

  # VideoRoom plugin admin key — required for room create/destroy via API.
  # Must match janus.plugin.videoroom.jcfg admin_key.
  JANUS_VIDEOROOM_ADMIN_KEY: "REPLACE_ME_JANUS_VIDEOROOM_KEY"
