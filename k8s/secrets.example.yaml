# Copy to secrets.yaml, fill values, then: kubectl apply -f k8s/secrets.yaml
# Never commit real secrets. CI builds images only — secrets are runtime on GKE.
apiVersion: v1
kind: Secret
metadata:
  name: kzys-secrets
  namespace: kzys
  labels:
    app.kubernetes.io/part-of: project-k
type: Opaque
stringData:
  JWT_SIGNING_SECRET: "REPLACE_ME"
  LIVEKIT_API_KEY: "REPLACE_ME"
  LIVEKIT_API_SECRET: "REPLACE_ME"
  # LiveKit server env format: "apikey: apisecret"
  LIVEKIT_KEYS: "REPLACE_ME_KEY: REPLACE_ME_SECRET"
  TURN_SHARED_SECRET: "REPLACE_ME"
