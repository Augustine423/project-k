name: Load Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: load-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit:
    name: Backend scalability unit tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore backend-csharp.Tests/backend-csharp.Tests.csproj

      - name: Test
        env:
          REDIS_URL: redis://localhost:6379
        run: dotnet test backend-csharp.Tests/backend-csharp.Tests.csproj -c Release --no-restore --verbosity normal

  load-test:
    name: k6 control plane load test
    runs-on: ubuntu-latest
    needs: backend-unit
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Publish control plane
        run: dotnet publish backend-csharp/backend-csharp.csproj -c Release -o /tmp/kzys-api

      - name: Run k6 load tests
        env:
          ASPNETCORE_URLS: http://127.0.0.1:4000
          REDIS_URL: redis://localhost:6379
          PORT: "4000"
          MAX_ROOM_PARTICIPANTS: "10000"
          LARGE_ROOM_EVENT_THRESHOLD: "200"
          JWT_SIGNING_SECRET: ci-load-test-secret
          TURN_SHARED_SECRET: ci-turn-secret
          CORS_ORIGIN: "*"
          LIVEKIT_API_KEY: devkey
          LIVEKIT_API_SECRET: dev-livekit-local-secret-32chars-min
          LIVEKIT_PUBLIC_URL: ws://127.0.0.1:7880
          BASE_URL: http://127.0.0.1:4000
          MAX_USERS: "10000"
          TARGET_VUS: "400"
        run: |
          set -euo pipefail
          dotnet /tmp/kzys-api/Kzys.Backend.dll &
          API_PID=$!
          cleanup() { kill "$API_PID" 2>/dev/null || true; }
          trap cleanup EXIT

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4000/ready >/dev/null; then
              echo "control plane ready"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "control plane failed to become ready"
              exit 1
            fi
            sleep 1
          done

          k6 run loadtests/pagination-smoke.js
          k6 run loadtests/join-storm.js
