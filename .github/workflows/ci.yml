name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Build C# control plane
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-csharp
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore backend-csharp.csproj

      - name: Build
        run: dotnet build backend-csharp.csproj -c Release --no-restore

      - name: Publish
        run: dotnet publish backend-csharp.csproj -c Release -o /tmp/publish --no-build

  backend-tests:
    name: Backend scalability tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore backend-csharp.Tests/backend-csharp.Tests.csproj

      - name: Test
        env:
          REDIS_URL: redis://localhost:6379
        run: dotnet test backend-csharp.Tests/backend-csharp.Tests.csproj -c Release --no-restore

  frontend:
    name: Build web frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck and build
        run: npm run build

  docker-build:
    name: Verify Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build control plane image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend-csharp/Dockerfile
          push: false
          load: true
          tags: project-k-csharp:ci

      - name: Build web production image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          target: production
          push: false
          load: true
          tags: project-k-web:ci
          build-args: |
            VITE_API_URL=
            NGINX_CONF=nginx.conf

      - name: Build web compose-prod image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          target: production
          push: false
          load: true
          tags: project-k-web-compose:ci
          build-args: |
            VITE_API_URL=
            NGINX_CONF=nginx.compose.conf

  kustomize-validate:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate base kustomization
        run: kubectl kustomize k8s/base > /dev/null

      - name: Validate GKE overlay
        run: kubectl kustomize k8s/overlays/gke > /dev/null

      - name: Validate stress-test overlay
        run: kubectl kustomize k8s/overlays/stress-test > /dev/null

      - name: Validate single-node overlay
        run: kubectl kustomize k8s/overlays/single-node > /dev/null
