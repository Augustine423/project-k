name: Build and Push Docker Hub

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  IMAGE_PREFIX: kyawzayarsoe/project-k

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      workflow: ${{ steps.filter.outputs.workflow }}
      csharp: ${{ steps.filter.outputs.csharp }}
      coturn: ${{ steps.filter.outputs.coturn }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            workflow:
              - '.github/workflows/docker-build.yml'
            csharp:
              - 'backend-csharp/**'
            coturn:
              - 'media/coturn/**'
              - 'infra/coturn/**'
            web:
              - 'web/**'

  verify-secrets:
    name: Verify Docker Hub secrets
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -z "$DOCKER_USERNAME" ] || [ -z "$DOCKER_PASSWORD" ]; then
            echo "::error::Missing DOCKER_USERNAME or DOCKER_PASSWORD repo secrets."
            echo "Add them at: Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "Docker Hub secrets are configured."

  build-csharp:
    name: Build C# control plane
    needs: [changes, verify-secrets]
    if: |
      always() &&
      (needs.verify-secrets.result == 'success' || needs.verify-secrets.result == 'skipped') &&
      (needs.changes.outputs.csharp == 'true' ||
       needs.changes.outputs.workflow == 'true' ||
       github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend-csharp/Dockerfile
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_PREFIX }}-csharp:latest
            ${{ env.IMAGE_PREFIX }}-csharp:${{ github.sha }}
          cache-from: type=gha,scope=csharp
          cache-to: type=gha,mode=max,scope=csharp

  build-coturn:
    name: Build coturn
    needs: [changes, verify-secrets]
    if: |
      always() &&
      (needs.verify-secrets.result == 'success' || needs.verify-secrets.result == 'skipped') &&
      (needs.changes.outputs.coturn == 'true' ||
       needs.changes.outputs.workflow == 'true' ||
       github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./media/coturn
          file: ./media/coturn/Dockerfile
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_PREFIX }}-coturn:latest
            ${{ env.IMAGE_PREFIX }}-coturn:${{ github.sha }}
          cache-from: type=gha,scope=coturn
          cache-to: type=gha,mode=max,scope=coturn

  build-web:
    name: Build web frontend
    needs: [changes, verify-secrets]
    if: |
      always() &&
      (needs.verify-secrets.result == 'success' || needs.verify-secrets.result == 'skipped') &&
      (needs.changes.outputs.web == 'true' ||
       needs.changes.outputs.workflow == 'true' ||
       github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          target: production
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_PREFIX }}-web:latest
            ${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}
          build-args: |
            VITE_API_URL=
            NGINX_CONF=nginx.compose.conf
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  all-green:
    name: Workflow summary
    needs: [build-csharp, build-coturn, build-web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check build results
        env:
          CSHARP: ${{ needs.build-csharp.result }}
          COTURN: ${{ needs.build-coturn.result }}
          WEB: ${{ needs.build-web.result }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "build-csharp: $CSHARP"
          echo "build-coturn: $COTURN"
          echo "build-web: $WEB"
          for result in "$CSHARP" "$COTURN" "$WEB"; do
            if [ "$result" = "failure" ]; then
              echo "::error::One or more image builds failed."
              exit 1
            fi
          done
          if [ "$CSHARP" = "skipped" ] && [ "$COTURN" = "skipped" ] && [ "$WEB" = "skipped" ]; then
            if [ "$EVENT" = "pull_request" ]; then
              echo "No image paths changed on this PR — build jobs skipped (OK)."
              exit 0
            fi
            echo "::error::No build jobs ran."
            exit 1
          fi
          echo "All executed build jobs succeeded."
