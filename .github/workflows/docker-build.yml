name: Build and Push

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend-go, backend-c, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build and Push
        run: |
          docker build -t your-registry/${{ matrix.service }}:latest ./${{ matrix.service }}
          docker push your-registry/${{ matrix.service }}:latest
