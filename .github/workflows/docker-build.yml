name: Build and Push Docker Images

on:
  push:
    branches: [main, master]

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: kyawzayarsoe/project-k

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: server
            context: ./server
            file: ./server/Dockerfile
            target: ""
            build-args: ""
          - service: livekit
            context: ./media/livekit
            file: ./media/livekit/Dockerfile
            target: ""
            build-args: ""
          - service: coturn
            context: ./media/coturn
            file: ./media/coturn/Dockerfile
            target: ""
            build-args: ""
          # Web: Vite bakes VITE_* at image build time only.
          # Leave VITE_API_URL empty so the browser uses same-origin routing
          # through the GKE Gateway (HTTPS /api, /ws). LiveKit URL comes from
          # the join ticket (server runtime LIVEKIT_URL), not the web image.
          - service: web
            context: ./web
            file: ./web/Dockerfile
            target: production
            build-args: |
              VITE_API_URL=

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: ${{ matrix.target }}
