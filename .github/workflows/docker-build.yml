name: Build and Push

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend-go, backend-csharp, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: kyawzayarsoe/${{ matrix.service }}:latest,kyawzayarsoe/${{ matrix.service }}:${{ github.sha }}
          # Frontend only. Leave REACT_APP_LIVEKIT_URL secret unset for dev k8s (no DNS);
          # the SPA defaults to ws(s)://<current-host>/rtc at runtime.
          build-args: ${{ matrix.service == 'frontend' && format('REACT_APP_LIVEKIT_URL={0}', secrets.REACT_APP_LIVEKIT_URL) || '' }}
