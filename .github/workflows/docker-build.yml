name: Build and Push Docker Hub

on:
  push:
    branches: [main, master]
    paths:
      - "backend-csharp/**"
      - "web/**"
      - ".github/workflows/docker-build.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "backend-csharp/**"
      - "web/**"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

env:
  IMAGE_PREFIX: kyawzayarsoe/project-k

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  # Native git diff — no marketplace action (avoids "Failed to resolve action" / 503).
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      workflow: ${{ steps.filter.outputs.workflow }}
      csharp: ${{ steps.filter.outputs.csharp }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect path changes
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          # workflow_dispatch → rebuild both images
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "workflow=true" >> "$GITHUB_OUTPUT"
            echo "csharp=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch — building csharp + web"
            exit 0
          fi

          before="${{ github.event.before }}"
          after="${{ github.sha }}"

          # PR: compare against base branch
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            before="${{ github.event.pull_request.base.sha }}"
            after="${{ github.event.pull_request.head.sha }}"
          fi

          # First push / missing before → treat everything as changed
          if [ -z "${before}" ] || [ "${before}" = "0000000000000000000000000000000000000000" ]; then
            echo "workflow=true" >> "$GITHUB_OUTPUT"
            echo "csharp=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "No usable before SHA — building csharp + web"
            exit 0
          fi

          changed="$(git diff --name-only "$before" "$after" || true)"
          echo "Changed files:"
          echo "$changed"

          workflow=false
          csharp=false
          web=false

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              .github/workflows/docker-build.yml) workflow=true ;;
              backend-csharp/*) csharp=true ;;
              web/*) web=true ;;
            esac
          done <<< "$changed"

          # Top-level paths filter already limited runs; if diff is empty, still build both.
          if [ "$workflow" = false ] && [ "$csharp" = false ] && [ "$web" = false ]; then
            csharp=true
            web=true
            echo "Empty filtered diff — building csharp + web as fallback"
          fi

          echo "workflow=$workflow" >> "$GITHUB_OUTPUT"
          echo "csharp=$csharp" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "Result: workflow=$workflow csharp=$csharp web=$web"

  verify-secrets:
    name: Verify Docker Hub secrets
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -z "$DOCKER_USERNAME" ] || [ -z "$DOCKER_PASSWORD" ]; then
            echo "::error::Missing DOCKER_USERNAME or DOCKER_PASSWORD repo secrets."
            echo "Add them at: Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "Docker Hub secrets are configured."

  build-csharp:
    name: Build C# control plane
    needs: [changes, verify-secrets]
    if: |
      always() &&
      (needs.verify-secrets.result == 'success' || needs.verify-secrets.result == 'skipped') &&
      (
        needs.changes.result != 'success' ||
        needs.changes.outputs.csharp == 'true' ||
        needs.changes.outputs.workflow == 'true' ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend-csharp/Dockerfile
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_PREFIX }}-csharp:latest
            ${{ env.IMAGE_PREFIX }}-csharp:${{ github.sha }}
          cache-from: type=gha,scope=csharp
          cache-to: type=gha,mode=max,scope=csharp

  build-web:
    name: Build web frontend
    needs: [changes, verify-secrets]
    if: |
      always() &&
      (needs.verify-secrets.result == 'success' || needs.verify-secrets.result == 'skipped') &&
      (
        needs.changes.result != 'success' ||
        needs.changes.outputs.web == 'true' ||
        needs.changes.outputs.workflow == 'true' ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          target: production
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_PREFIX }}-web:latest
            ${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}
          build-args: |
            VITE_API_URL=
            NGINX_CONF=nginx.compose.conf
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  all-green:
    name: Workflow summary
    needs: [build-csharp, build-web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check build results
        env:
          CSHARP: ${{ needs.build-csharp.result }}
          WEB: ${{ needs.build-web.result }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "build-csharp: $CSHARP"
          echo "build-web: $WEB"
          for result in "$CSHARP" "$WEB"; do
            if [ "$result" = "failure" ]; then
              echo "::error::One or more image builds failed."
              exit 1
            fi
          done
          if [ "$CSHARP" = "skipped" ] && [ "$WEB" = "skipped" ]; then
            if [ "$EVENT" = "pull_request" ] || [ "$EVENT" = "push" ]; then
              echo "No related image paths changed — build jobs skipped (OK)."
              exit 0
            fi
            echo "::error::No build jobs ran."
            exit 1
          fi
          echo "All executed build jobs succeeded."
