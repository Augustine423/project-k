name: Build and Push

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: backend-csharp
            context: .
            dockerfile: ./backend-csharp/Dockerfile
          - service: frontend
            context: .
            dockerfile: ./frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            kyawzayarsoe/${{ matrix.service }}:latest
            kyawzayarsoe/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=registry,ref=kyawzayarsoe/${{ matrix.service }}:cache
          cache-to: type=registry,ref=kyawzayarsoe/${{ matrix.service }}:cache,mode=max
