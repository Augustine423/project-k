# LiveKit SFU — GKE / load-test port range (not used by local docker-compose).
port: 7880
bind_addresses:
  - ""

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 59000
  use_external_ip: true
  allow_tcp_fallback: true
  congestion_control:
    enabled: true
    allow_pause: true

redis:
  address: redis.kzys.svc.cluster.local:6379

room:
  auto_create: true
  empty_timeout: 300
  max_participants: 10

logging:
  level: info
