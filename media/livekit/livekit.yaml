# Advertise a reachable host IP for ICE (LAN/public). Override via --node-ip / LIVEKIT_NODE_IP.
# Redis enables distributed multi-node SFU (same as k8s kzys-livekit-config).
port: 7880
bind_addresses:
  - ""
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50999
  use_external_ip: false
  node_ip: 127.0.0.1
  enable_loopback_candidate: true
redis:
  address: redis:6379
room:
  empty_timeout: 300
  departure_timeout: 20
node_selector:
  kind: sysload
  sysload_limit: 0.75
keys:
  devkey: dev-livekit-local-secret-32chars-min
logging:
  level: info
