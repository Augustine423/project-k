<!DOCTYPE html>
<html>
<head>
    <title>KZYS Video Meeting Test</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        #videos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
        video { width: 100%; background: #000; }
        .controls { margin: 20px 0; }
        button { padding: 10px; margin: 5px; }
    </style>
</head>
<body>
    <h1>KZYS Video Meeting Test</h1>
    
    <div class="controls">
        <input id="roomId" placeholder="Room ID" value="1234">
        <input id="userName" placeholder="Your Name" value="User">
        <button onclick="joinRoom()">Join Room</button>
        <button onclick="leaveRoom()">Leave Room</button>
        <button onclick="toggleVideo()">Toggle Video</button>
        <button onclick="toggleAudio()">Toggle Audio</button>
    </div>
    
    <div id="status">Status: Not connected</div>
    
    <div id="videos">
        <video id="localVideo" autoplay muted></video>
    </div>
    
    <script>
        let localStream = null;
        let roomId = null;
        
        async function joinRoom() {
            roomId = document.getElementById('roomId').value;
            const userName = document.getElementById('userName').value;
            
            try {
                // Get user media
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: true
                });
                
                // Show local video
                const localVideo = document.getElementById('localVideo');
                localVideo.srcObject = localStream;
                
                // Simulate API call to backend
                document.getElementById('status').textContent = 
                    `Status: Joined room ${roomId} as ${userName}`;
                
                console.log(`Joined room ${roomId} as ${userName}`);
                
            } catch (err) {
                console.error('Error accessing media:', err);
                document.getElementById('status').textContent = 'Error accessing camera/mic';
            }
        }
        
        function leaveRoom() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            document.getElementById('localVideo').srcObject = null;
            document.getElementById('status').textContent = 'Status: Left room';
            roomId = null;
        }
        
        function toggleVideo() {
            if (localStream) {
                const videoTrack = localStream.getVideoTracks()[0];
                if (videoTrack) {
                    videoTrack.enabled = !videoTrack.enabled;
                    console.log('Video', videoTrack.enabled ? 'enabled' : 'disabled');
                }
            }
        }
        
        function toggleAudio() {
            if (localStream) {
                const audioTrack = localStream.getAudioTracks()[0];
                if (audioTrack) {
                    audioTrack.enabled = !audioTrack.enabled;
                    console.log('Audio', audioTrack.enabled ? 'enabled' : 'disabled');
                }
            }
        }
        
        // Auto-join for testing
        window.onload = function() {
            setTimeout(joinRoom, 1000);
        };
    </script>
</body>
</html>
