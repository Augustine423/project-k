apiVersion: apps/v1
kind: Deployment
metadata:
  name: kzys-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kzys-frontend
  template:
    metadata:
      labels:
        app: kzys-frontend
    spec:
      containers:
      - name: frontend
        image: your-registry/frontend:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: kzys-frontend-service
spec:
  selector:
    app: kzys-frontend
  ports:
  - port: 80
    targetPort: 80
  type: LoadBalancer
