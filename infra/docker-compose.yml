name: project-k

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Single media node for local dev. To scale horizontally, copy this
  # service block (janus-2, janus-3, ...), give each a unique JANUS_NODE_ID,
  # and add it to JANUS_NODES in server's environment -- the control plane's
  # Router (server/internal/router) picks it up automatically, no code changes.
  janus:
    build:
      context: ../media/janus
    restart: unless-stopped
    environment:
      JANUS_NODE_ID: janus-1
      STUN_SERVER: ${STUN_SERVER}
      JANUS_ADMIN_SECRET: ${JANUS_ADMIN_SECRET}
      JANUS_VIDEOROOM_ADMIN_KEY: ${JANUS_VIDEOROOM_ADMIN_KEY}
      JANUS_CORS_ORIGIN: "*"
      JANUS_RTP_PORT_RANGE: "10000-10200"
      JANUS_STREAMING_PORT_RANGE: "15000-15200"
    ports:
      - "${JANUS_HTTP_PORT}:8088"
      - "${JANUS_ADMIN_PORT}:7088"
      - "${JANUS_WS_PORT}:8188"
      - "10000-10200:10000-10200/udp"
      - "15000-15200:15000-15200/udp"

  janus-2:
    build:
      context: ../media/janus
    restart: unless-stopped
    environment:
      JANUS_NODE_ID: janus-2
      STUN_SERVER: ${STUN_SERVER}
      JANUS_ADMIN_SECRET: ${JANUS_ADMIN_SECRET}
      JANUS_VIDEOROOM_ADMIN_KEY: ${JANUS_VIDEOROOM_ADMIN_KEY}
      JANUS_CORS_ORIGIN: "*"
      JANUS_RTP_PORT_RANGE: "11000-11200"
      JANUS_STREAMING_PORT_RANGE: "16000-16200"
    ports:
      - "8089:8088"
      - "7089:7088"
      - "8189:8188"
      - "11000-11200:11000-11200/udp"
      - "16000-16200:15000-15200/udp"

  coturn:
    image: coturn/coturn:4.6.2
    restart: unless-stopped
    command:
      - "-c"
      - "/etc/coturn/turnserver.conf"
      - "--realm=projectk.local"
      - "--static-auth-secret=${TURN_SHARED_SECRET}"
      - "--external-ip=${PUBLIC_HOST}"
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    ports:
      - "${TURN_PORT}:3478"
      - "${TURN_PORT}:3478/udp"
      - "20000-20200:20000-20200/udp"

  server:
    build:
      context: ../server
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      PORT: 4000
      REDIS_URL: redis://redis:6379
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET}
      TURN_HOST: ${PUBLIC_HOST}
      TURN_PORT: ${TURN_PORT}
      # Comma-separated pool of Janus nodes this control plane can route rooms to.
      # Format: nodeId|internalAdminUrl|internalWsUrl|publicWsUrl
      JANUS_NODES: "janus-1|http://janus:7088/admin|ws://janus:8188|ws://${PUBLIC_HOST}:${JANUS_WS_PORT},janus-2|http://janus-2:7088/admin|ws://janus-2:8188|ws://${PUBLIC_HOST}:8189"
      JANUS_ADMIN_SECRET: ${JANUS_ADMIN_SECRET}
      JANUS_VIDEOROOM_ADMIN_KEY: ${JANUS_VIDEOROOM_ADMIN_KEY}
      JANUS_STREAMING_PORT_RANGE: "15000-15200"
      CORS_ORIGIN: "http://${PUBLIC_HOST}:${WEB_PORT}"
    ports:
      - "${SERVER_PORT}:4000"

  web:
    build:
      context: ../web
    restart: unless-stopped
    depends_on:
      - server
    environment:
      VITE_API_URL: "http://${PUBLIC_HOST}:${SERVER_PORT}"
    ports:
      - "${WEB_PORT}:5173"
    volumes:
      - ../web/src:/app/src
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

volumes:
  redis-data:
