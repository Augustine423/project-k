# coturn STUN/TURN server for local dev.
#
# Uses the TURN REST API shared-secret mechanism (use-auth-secret): the
# control plane (server/src/turn) mints short-lived HMAC credentials per
# participant instead of provisioning static accounts, so credentials
# can't be replayed after they expire.
#
# `static-auth-secret` and `realm` are intentionally NOT set here -- coturn's
# config file has no environment variable expansion, so those two are passed
# as CLI flags from infra/docker-compose.yml, which docker compose itself
# expands from infra/.env.

listening-port=3478
tls-listening-port=5349

use-auth-secret

min-port=20000
max-port=20200

# Local dev: no TLS cert, plain STUN/TURN over UDP/TCP only.
no-tls
no-dtls

fingerprint
lt-cred-mech
no-multicast-peers
no-cli

log-file=stdout
verbose
