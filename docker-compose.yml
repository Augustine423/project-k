version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    networks:
      - kzys-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - BACKEND_HOST=backend  # Docker Compose service name
    depends_on:
      - backend
    networks:
      - kzys-network

networks:
  kzys-network:
    driver: bridge
