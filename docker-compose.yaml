name: project-k

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  janus:
    build:
      context: ./media/janus
    restart: unless-stopped
    environment:
      JANUS_NODE_ID: janus-1
      STUN_SERVER: ${STUN_SERVER}
      JANUS_ADMIN_SECRET: ${JANUS_ADMIN_SECRET}
      JANUS_VIDEOROOM_ADMIN_KEY: ${JANUS_VIDEOROOM_ADMIN_KEY}
      JANUS_CORS_ORIGIN: "*"
      JANUS_RTP_PORT_RANGE: "10000-10200"
      JANUS_STREAMING_PORT_RANGE: "15000-15200"
    ports:
      - "${JANUS_HTTP_PORT}:8088"
      - "${JANUS_ADMIN_PORT}:7088"
      - "${JANUS_WS_PORT}:8188"
      - "10000-10200:10000-10200/udp"
      - "15000-15200:15000-15200/udp"

  media-core:
    build:
      context: ./media-core
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      janus:
        condition: service_started
    environment:
      REDIS_URL: redis://redis:6379
      JANUS_ADMIN_SECRET: ${JANUS_ADMIN_SECRET}
      JANUS_NODES: "janus-1|http://janus:7088/admin|ws://janus:8188|ws://${PUBLIC_HOST}:${JANUS_WS_PORT}"
      MEDIA_CORE_POLL_MS: "1000"

  coturn:
    image: coturn/coturn:4.6.2
    restart: unless-stopped
    command:
      - "-c"
      - "/etc/coturn/turnserver.conf"
      - "--realm=${TURN_REALM}"
      - "--static-auth-secret=${TURN_SHARED_SECRET}"
      - "--external-ip=${PUBLIC_HOST}"
    volumes:
      - ./infra/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    ports:
      - "${TURN_PORT}:3478"
      - "${TURN_PORT}:3478/udp"
      - "20000-20200:20000-20200/udp"

  server:
    build:
      context: .
      dockerfile: backend-csharp/Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      janus:
        condition: service_started
    environment:
      PORT: 4000
      REDIS_URL: redis://redis:6379
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET}
      TURN_HOST: ${PUBLIC_HOST}
      TURN_PORT: ${TURN_PORT}
      TURN_TLS_PORT: ${TURN_TLS_PORT}
      TURN_USE_TLS: ${TURN_USE_TLS}
      MAX_ROOM_PARTICIPANTS: "50"
      WEBINAR_ENTER_LISTENERS: "12"
      WEBINAR_ENTER_RATIO: "2.0"
      WEBINAR_EXIT_LISTENERS: "8"
      INTERACTIVE_MAX_PUBLISHERS: "50"
      WEBINAR_MAX_PUBLISHERS: "8"
      CORS_ORIGIN: "${CORS_ORIGIN}"
      SERVICE_NAME: kzys-control-plane
      JANUS_NODES: "janus-1|http://janus:7088/admin|ws://janus:8188|ws://${PUBLIC_HOST}:${JANUS_WS_PORT}"
      JANUS_ADMIN_SECRET: ${JANUS_ADMIN_SECRET}
      JANUS_VIDEOROOM_ADMIN_KEY: ${JANUS_VIDEOROOM_ADMIN_KEY}
    ports:
      - "${SERVER_PORT}:4000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ./web
      target: dev
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      VITE_API_URL: "${PUBLIC_API_URL}"
      VITE_PROXY_TARGET: "http://server:4000"
      VITE_JANUS_PROXY_TARGET: "http://janus:8188"
    ports:
      - "${WEB_PORT}:5173"
    volumes:
      - ./web/src:/app/src
      - ./web/index.html:/app/index.html
      - ./web/vite.config.ts:/app/vite.config.ts

volumes:
  redis-data:
