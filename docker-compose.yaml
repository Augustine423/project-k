name: project-k

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  coturn:
    image: coturn/coturn:4.6.2
    restart: unless-stopped
    command:
      - "-c"
      - "/etc/coturn/turnserver.conf"
      - "--realm=${TURN_REALM}"
      - "--static-auth-secret=${TURN_SHARED_SECRET}"
    volumes:
      - ./infra/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    ports:
      - "${TURN_PORT}:3478"
      - "${TURN_PORT}:3478/udp"
      - "20000-20200:20000-20200/udp"

  livekit:
    image: livekit/livekit-server:v1.9.12
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      NODE_IP: ${PUBLIC_HOST}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./infra/livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "${LIVEKIT_HTTP_PORT}:7880"
      - "${LIVEKIT_RTC_TCP_PORT}:7881"
      - "51000-51030:51000-51030/udp"

  server:
    build:
      context: ./server
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
    environment:
      PORT: 4000
      REDIS_URL: redis://redis:6379
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_URL: "${LIVEKIT_PUBLIC_URL}"
      LIVEKIT_INTERNAL_URL: "ws://livekit:7880"
      MAX_ROOM_PARTICIPANTS: "10"
      CORS_ORIGIN: "${CORS_ORIGIN}"
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET}
      TURN_HOST: ${PUBLIC_HOST}
      TURN_PORT: ${TURN_PORT}
      TURN_TLS_PORT: ${TURN_TLS_PORT}
      TURN_USE_TLS: ${TURN_USE_TLS}
      SERVICE_NAME: kzys-control-plane
    ports:
      - "${SERVER_PORT}:4000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:4000/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  web:
    build:
      context: ./web
      target: dev
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      VITE_API_URL: "${PUBLIC_API_URL}"
      VITE_LIVEKIT_URL: "${LIVEKIT_PUBLIC_URL}"
      VITE_PROXY_TARGET: "http://server:4000"
      VITE_LIVEKIT_PROXY_TARGET: "http://livekit:7880"
    ports:
      - "${WEB_PORT}:5173"
    volumes:
      - ./web/src:/app/src
      - ./web/index.html:/app/index.html
      - ./web/vite.config.ts:/app/vite.config.ts

volumes:
  redis-data:
